<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#075BFF">

  <title>Signify Workforce</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      color: #172033;
    }

    .header {
      background: #075BFF;
      color: white;
      padding: 25px 20px;
      border-radius: 0 0 25px 25px;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .header p {
      margin: 8px 0 0;
      opacity: .9;
    }

    .container {
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .card .number {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    .section-title {
      margin-top: 25px;
      margin-bottom: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    .button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 15px;
      background: #075BFF;
      color: white;
      font-size: 17px;
      margin-bottom: 10px;
    }

    .button.secondary {
      background: white;
      color: #075BFF;
      border: 1px solid #075BFF;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Signify Workforce</h1>
    <p>نظام إدارة الموظفين والحضور والـ KPI</p>
  </div>

  <div class="container">

    <div class="section-title">
      لوحة القيادة
    </div>

    <div class="cards">

      <div class="card">
        👥 الموظفين
        <div class="number">0</div>
      </div>

      <div class="card">
        ✅ الحضور
        <div class="number">0</div>
      </div>

      <div class="card">
        ❌ الغياب
        <div class="number">0</div>
      </div>

      <div class="card">
        ⏰ المتأخرين
        <div class="number">0</div>
      </div>

    </div>

    <div class="section-title">
      إجراءات سريعة
    </div>

    <button class="button">
      تسجيل الحضور
    </button>

    <button class="button secondary">
      الموظفين
    </button>

    <button class="button secondary">
      KPI
    </button>

    <button class="button secondary">
      التقارير
    </button>

  </div>

</body>
    </html>
