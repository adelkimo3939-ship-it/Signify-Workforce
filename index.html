<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#075BFF">
<title>Signify Workforce V2</title>

<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}

body{
 margin:0;
 background:#f4f7fb;
 color:#172033;
}

.hidden{display:none!important}

button,input,select,textarea{font-family:inherit}
button{cursor:pointer}

.login-page{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:linear-gradient(135deg,#075BFF,#00358f);
}

.login-box{
 width:100%;
 max-width:430px;
 background:white;
 border-radius:25px;
 padding:30px 22px;
 box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.logo{
 text-align:center;
 font-size:30px;
 font-weight:bold;
 color:#075BFF;
 margin-bottom:5px;
}

.subtitle{
 text-align:center;
 color:#777;
 margin-bottom:25px;
}

label{
 display:block;
 margin:12px 0 7px;
 font-weight:bold;
}

input,select,textarea{
 width:100%;
 border:1px solid #d7dce5;
 border-radius:12px;
 padding:13px;
 font-size:16px;
 background:white;
}

textarea{
 min-height:100px;
 resize:vertical;
}

button{
 border:0;
 border-radius:12px;
 padding:11px 15px;
}

.primary{
 width:100%;
 background:#075BFF;
 color:white;
 padding:14px;
 font-size:17px;
 margin-top:18px;
}

.secondary{
 background:white;
 color:#075BFF;
 border:1px solid #075BFF;
}

.success{
 background:#16a05d!important;
 color:white!important;
}

.danger{
 background:#e53935!important;
 color:white!important;
}

.warning{
 background:#f5b400!important;
 color:white!important;
}

.app{min-height:100vh}

.topbar{
 background:#075BFF;
 color:white;
 padding:16px 18px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
}

.topbar h2{
 margin:0;
 font-size:21px;
}

.logout{
 background:white;
 color:#075BFF;
}

.container{
 max-width:1200px;
 margin:auto;
 padding:18px;
}

.cards{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
}

.card{
 background:white;
 border-radius:18px;
 padding:18px;
 box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.card-title{
 color:#697386;
 font-size:14px;
}

.number{
 font-size:29px;
 font-weight:bold;
 margin-top:8px;
 color:#075BFF;
}

.section{margin-top:20px}

.panel{
 background:white;
 padding:18px;
 border-radius:18px;
 box-shadow:0 3px 14px rgba(0,0,0,.06);
 margin-bottom:15px;
 overflow:auto;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:12px;
}

.menu{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
}

.menu button{
 padding:16px;
 background:white;
 color:#075BFF;
 font-size:16px;
 box-shadow:0 3px 12px rgba(0,0,0,.07);
}

table{
 width:100%;
 border-collapse:collapse;
 margin-top:12px;
 background:white;
 min-width:650px;
}

th,td{
 border-bottom:1px solid #eee;
 padding:11px 7px;
 text-align:center;
 font-size:14px;
}

th{background:#f0f4fa}

.notice{
 background:#fff6d8;
 border-right:5px solid #f5b400;
 padding:12px;
 border-radius:10px;
 margin-bottom:10px;
}

.empty{
 text-align:center;
 color:#777;
 padding:25px;
}

.kpi-box{
 background:linear-gradient(135deg,#075BFF,#00358f);
 color:white;
 border-radius:22px;
 padding:25px;
 text-align:center;
 margin-bottom:15px;
}

.kpi-number{
 font-size:58px;
 font-weight:bold;
}

.badge{
 display:inline-block;
 padding:6px 10px;
 border-radius:20px;
 font-size:12px;
 font-weight:bold;
}

.badge-green{
 background:#dff6e9;
 color:#16804a;
}

.badge-red{
 background:#ffe2e2;
 color:#c62828;
}

.badge-yellow{
 background:#fff1bd;
 color:#9a7000;
}

.stat{
 text-align:center;
 padding:15px;
 background:#f7f9fc;
 border-radius:14px;
}

.stat b{
 display:block;
 font-size:27px;
 color:#075BFF;
 margin-top:6px;
}

.small{
 font-size:13px;
 color:#777;
}

@media(max-width:800px){
 .cards{grid-template-columns:repeat(2,1fr)}
 .menu{grid-template-columns:1fr 1fr}
 .grid,.grid3{grid-template-columns:1fr}
}

@media(max-width:500px){
 .cards{grid-template-columns:1fr 1fr}
 .menu{grid-template-columns:1fr}
 .container{padding:10px}
 .topbar{padding:13px}
 .kpi-number{font-size:48px}
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div id="loginPage" class="login-page">

<div class="login-box">

<div class="logo">Signify Workforce</div>

<div class="subtitle">
نظام إدارة الموظفين والحضور والـ KPI
</div>

<label>نوع المستخدم</label>

<select id="loginType" onchange="updateLoginLabel()">
<option value="employee">موظف</option>
<option value="admin">مشرف</option>
<option value="viewer">ضيف - قراءة فقط</option>
</select>

<label id="codeLabel">كود الموظف</label>

<input id="loginCode" type="text" placeholder="اكتب الكود">

<label>كلمة المرور</label>

<input id="loginPassword" type="password" placeholder="اكتب كلمة المرور">

<button class="primary" onclick="login()">
تسجيل الدخول
</button>

<div id="loginMessage"
style="color:#e53935;text-align:center;margin-top:12px">
</div>

</div>
</div>


<!-- ================= APP ================= -->

<div id="app" class="app hidden">

<div class="topbar">

<div>
<h2>Signify Workforce</h2>
<div id="welcome"></div>
</div>

<button class="logout" onclick="logout()">خروج</button>

</div>

<div class="container">


<!-- ================= ADMIN ================= -->

<div id="adminPage" class="hidden">

<div class="cards">

<div class="card">
<div class="card-title">إجمالي الموظفين</div>
<div class="number" id="totalEmployees">0</div>
</div>

<div class="card">
<div class="card-title">حضور اليوم</div>
<div class="number" id="presentCount">0</div>
</div>

<div class="card">
<div class="card-title">غياب اليوم</div>
<div class="number" id="absentCount">0</div>
</div>

<div class="card">
<div class="card-title">تأخير اليوم</div>
<div class="number" id="lateCount">0</div>
</div>

</div>

<div class="section">

<div class="menu">

<button onclick="showAdminSection('attendance')">
🕘 الحضور والانصراف
</button>

<button onclick="showAdminSection('employees')">
👥 الموظفين
</button>

<button onclick="showAdminSection('monthly')">
📅 الحضور الشهري
</button>

<button onclick="showAdminSection('kpi')">
📊 KPI
</button>

<button onclick="showAdminSection('penalties')">
⚠️ التأخيرات والجزاءات
</button>

<button onclick="showAdminSection('leaveRequests')">
📝 طلبات الإجازة
</button>

<button onclick="showAdminSection('kaizen')">
💡 Kaizen
</button>

<button onclick="showAdminSection('viewers')">
👁️ إدارة الضيوف
</button>

<button onclick="showAdminSection('password')">
🔐 باسورد المشرف
</button>

</div>

</div>

<div id="adminContent" class="section"></div>

</div>


<!-- ================= VIEWER ================= -->

<div id="viewerPage" class="hidden">

<div class="panel">

<h3>👁️ لوحة القراءة فقط</h3>

<p>
يمكنك الاطلاع على بيانات الموظفين والحضور الشهري و KPI والتأخيرات والجزاءات.
</p>

</div>

<div class="menu">

<button onclick="showViewerSection('attendance')">
🕘 الحضور
</button>

<button onclick="showViewerSection('monthly')">
📅 الحضور الشهري
</button>

<button onclick="showViewerSection('kpi')">
📊 KPI
</button>

<button onclick="showViewerSection('penalties')">
⚠️ التأخيرات والجزاءات
</button>

</div>

<div id="viewerContent" class="section"></div>

</div>


<!-- ================= EMPLOYEE ================= -->

<div id="employeePage" class="hidden">

<div class="panel">

<h3 id="employeeName"></h3>

<div id="employeeNotifications"></div>

</div>

<div id="employeeHomeKPI"></div>

<div class="menu">

<button onclick="employeeAttendance()">
🕘 حضوري
</button>

<button onclick="employeeMonthly()">
📅 حضوري الشهري
</button>

<button onclick="employeeKPI()">
📊 KPI الخاص بي
</button>

<button onclick="employeeLeave()">
📝 طلب إجازة
</button>

<button onclick="employeeKaizen()">
💡 Kaizen
</button>

<button onclick="employeePassword()">
🔐 تغيير الباسورد
</button>

</div>

<div id="employeeContent" class="section"></div>

</div>

</div>
</div>


<script>

/* =========================================================
   DATA
========================================================= */

let employees =
JSON.parse(localStorage.getItem("sw_employees")) || [];

let attendance =
JSON.parse(localStorage.getItem("sw_attendance")) || [];

let penalties =
JSON.parse(localStorage.getItem("sw_penalties")) || [];

let leaves =
JSON.parse(localStorage.getItem("sw_leaves")) || [];

let kaizens =
JSON.parse(localStorage.getItem("sw_kaizens")) || [];

let viewers =
JSON.parse(localStorage.getItem("sw_viewers")) || [];

let currentUser=null;


/* =========================================================
   ADMIN
========================================================= */

let admin =
JSON.parse(localStorage.getItem("sw_admin"));

if(!admin){

admin={
 code:"admin",
 password:"1234",
 name:"مشرف النظام"
};

localStorage.setItem(
"sw_admin",
JSON.stringify(admin)
);

}


/* =========================================================
   HELPERS
========================================================= */

function today(){

return new Date().toISOString().slice(0,10);

}

function saveData(){

localStorage.setItem(
"sw_employees",
JSON.stringify(employees)
);

localStorage.setItem(
"sw_attendance",
JSON.stringify(attendance)
);

localStorage.setItem(
"sw_penalties",
JSON.stringify(penalties)
);

localStorage.setItem(
"sw_leaves",
JSON.stringify(leaves)
);

localStorage.setItem(
"sw_kaizens",
JSON.stringify(kaizens)
);

localStorage.setItem(
"sw_viewers",
JSON.stringify(viewers)
);

}

function employeeName(code){

const e=employees.find(x=>x.code===code);

return e ? e.name : code;

}

function employeeData(code){

return employees.find(x=>x.code===code);

}

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function monthNow(){

return today().slice(0,7);

}


/* =========================================================
   LOGIN
========================================================= */

function updateLoginLabel(){

const type=
document.getElementById("loginType").value;

const label=
document.getElementById("codeLabel");

if(type==="admin"){

label.innerText="كود المشرف";

}

else if(type==="viewer"){

label.innerText="كود الضيف";

}

else{

label.innerText="كود الموظف";

}

}

function login(){

const type=
document.getElementById("loginType").value;

const code=
document.getElementById("loginCode").value.trim();

const password=
document.getElementById("loginPassword").value;

const message=
document.getElementById("loginMessage");

message.innerText="";

if(!code || !password){

message.innerText="اكتب الكود وكلمة المرور";

return;

}


/* ADMIN */

if(type==="admin"){

if(
code===admin.code &&
password===admin.password
){

currentUser={
 type:"admin",
 code:admin.code,
 name:admin.name
};

openApp();
return;

}

message.innerText="بيانات المشرف غير صحيحة";
return;

}


/* EMPLOYEE */

if(type==="employee"){

const e=employees.find(
x=>x.code===code &&
x.password===password
);

if(!e){

message.innerText=
"كود الموظف أو كلمة المرور غير صحيحة";

return;

}

currentUser={
 type:"employee",
 code:e.code,
 name:e.name
};

openApp();
return;

}


/* VIEWER */

if(type==="viewer"){

const v=viewers.find(
x=>x.code===code &&
x.password===password
);

if(
(code==="viewer" && password==="1234") ||
v
){

currentUser={
 type:"viewer",
 code:code,
 name:v ? v.name : "قارئ البيانات"
};

openApp();
return;

}

message.innerText="بيانات الضيف غير صحيحة";

}

}


/* =========================================================
   OPEN APP
========================================================= */

function openApp(){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

document.getElementById("welcome")
.innerText=currentUser.name;

document.getElementById("adminPage")
.classList.add("hidden");

document.getElementById("employeePage")
.classList.add("hidden");

document.getElementById("viewerPage")
.classList.add("hidden");


if(currentUser.type==="admin"){

document.getElementById("adminPage")
.classList.remove("hidden");

updateDashboard();

showAdminSection("employees");

}


if(currentUser.type==="employee"){

document.getElementById("employeePage")
.classList.remove("hidden");

loadEmployee();

}


if(currentUser.type==="viewer"){

document.getElementById("viewerPage")
.classList.remove("hidden");

showViewerSection("attendance");

}

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

currentUser=null;

document.getElementById("app")
.classList.add("hidden");

document.getElementById("loginPage")
.classList.remove("hidden");

document.getElementById("loginCode").value="";
document.getElementById("loginPassword").value="";
document.getElementById("loginMessage").innerText="";

}


/* =========================================================
   DASHBOARD
========================================================= */

function updateDashboard(){

const d=today();

const present=
attendance.filter(
a=>a.date===d &&
a.status==="حضور"
).length;

const absent=
attendance.filter(
a=>a.date===d &&
a.status==="غياب"
).length;

const late=
attendance.filter(
a=>a.date===d &&
a.late
).length;

document.getElementById("totalEmployees")
.innerText=employees.length;

document.getElementById("presentCount")
.innerText=present;

document.getElementById("absentCount")
.innerText=absent;

document.getElementById("lateCount")
.innerText=late;

}


/* =========================================================
   ADMIN - EMPLOYEES
========================================================= */

function showAdminSection(section){

const box=
document.getElementById("adminContent");


/* EMPLOYEES */

if(section==="employees"){

box.innerHTML=`

<div class="panel">

<h3>➕ إضافة موظف</h3>

<div class="grid">

<div>
<label>اسم الموظف</label>
<input id="newName">
</div>

<div>
<label>كود الموظف</label>
<input id="newCode">
</div>

<div>
<label>الباسورد</label>
<input id="newPassword" value="1234">
</div>

<div>
<label>الوظيفة</label>
<input id="newJob">
</div>

<div>
<label>القسم</label>
<input id="newDepartment">
</div>

</div>

<button class="primary"
onclick="addEmployee()">
إضافة الموظف
</button>

</div>


<div class="panel">

<h3>👥 قائمة الموظفين</h3>

<table>

<tr>
<th>الكود</th>
<th>الاسم</th>
<th>الوظيفة</th>
<th>القسم</th>
<th>الباسورد</th>
<th>إجراء</th>
</tr>

${
employees.length===0
?
`<tr><td colspan="6">لا يوجد موظفين</td></tr>`
:
employees.map(e=>`

<tr>

<td>${esc(e.code)}</td>

<td>${esc(e.name)}</td>

<td>${esc(e.job||"-")}</td>

<td>${esc(e.department||"-")}</td>

<td>${esc(e.password)}</td>

<td>

<button class="secondary"
onclick="editEmployee('${esc(e.code)}')">
تعديل
</button>

<button class="danger"
onclick="deleteEmployee('${esc(e.code)}')">
حذف
</button>

</td>

</tr>

`).join("")
}

</table>

</div>
`;

return;
}


/* ATTENDANCE */

if(section==="attendance"){

box.innerHTML=`

<div class="panel">

<h3>🕘 تسجيل حالة يوم</h3>

<div class="grid">

<div>

<label>الموظف</label>

<select id="attendanceEmployee">

${employees.map(e=>`

<option value="${esc(e.code)}">
${esc(e.code)} - ${esc(e.name)}
</option>

`).join("")}

</select>

</div>

<div>

<label>التاريخ</label>

<input type="date"
id="attendanceDate"
value="${today()}">

</div>

<div>

<label>وقت الحضور</label>

<input type="time"
id="attendanceTime"
value="08:00">

</div>

<div>

<label>الحالة</label>

<select id="attendanceStatus">

<option>حضور</option>
<option>غياب</option>
<option>مرضي</option>
<option>عارضة</option>
<option>إجازة</option>

</select>

</div>

<div>

<label>تأخير؟</label>

<select id="attendanceLate">

<option value="no">لا</option>
<option value="yes">نعم</option>

</select>

</div>

</div>

<button class="primary"
onclick="saveAttendance()">
حفظ الحالة
</button>

</div>


<div class="panel">

<h3>📋 آخر التسجيلات</h3>

<table>

<tr>
<th>التاريخ</th>
<th>الموظف</th>
<th>الحالة</th>
<th>وقت الحضور</th>
<th>تأخير</th>
</tr>

${
attendance.slice().reverse().map(a=>`

<tr>

<td>${esc(a.date)}</td>
<td>${esc(employeeName(a.code))}</td>
<td>${esc(a.status)}</td>
<td>${esc(a.time||"-")}</td>

<td>
${a.late
?'<span class="badge badge-red">نعم</span>'
:'<span class="badge badge-green">لا</span>'}
</td>

</tr>

`).join("")
}

</table>

</div>
`;

return;
}


/* MONTHLY */

if(section==="monthly"){

box.innerHTML=`

<div class="panel">

<h3>📅 سجل الحضور الشهري</h3>

<div class="grid">

<div>

<label>الموظف</label>

<select id="monthlyEmployee">

${employees.map(e=>`

<option value="${esc(e.code)}">
${esc(e.code)} - ${esc(e.name)}
</option>

`).join("")}

</select>

</div>

<div>

<label>الشهر</label>

<input type="month"
id="monthlyMonth"
value="${monthNow()}">

</div>

</div>

<button class="primary"
onclick="showAdminMonthly()">
عرض السجل
</button>

</div>

<div id="adminMonthlyResult"></div>
`;

return;
}


/* KPI */

if(section==="kpi"){

box.innerHTML=`

<div class="panel">

<h3>📊 KPI الموظفين</h3>

<table>

<tr>
<th>الكود</th>
<th>الموظف</th>
<th>التأخير</th>
<th>تأخير بريك</th>
<th>الجزاءات</th>
<th>الزي</th>
<th>KPI</th>
</tr>

${
employees.map(e=>{

const r=calculateKPI(e.code);

return`

<tr>

<td>${esc(e.code)}</td>
<td>${esc(e.name)}</td>
<td>${r.late}</td>
<td>${r.breakLate}</td>
<td>${r.penalties}</td>
<td>${r.uniform}</td>

<td>
<b>${r.kpi}%</b>
</td>

</tr>
`;

}).join("")
}

</table>

</div>
`;

return;
}


/* PENALTIES */

if(section==="penalties"){

box.innerHTML=`

<div class="panel">

<h3>⚠️ إضافة تأخير / جزاء</h3>

<div class="grid">

<div>

<label>الموظف</label>

<select id="penaltyEmployee">

${employees.map(e=>`

<option value="${esc(e.code)}">
${esc(e.code)} - ${esc(e.name)}
</option>

`).join("")}

</select>

</div>

<div>

<label>النوع</label>

<select id="penaltyType">

<option>تأخير</option>
<option>تأخير من البريك</option>
<option>جزاء</option>
<option>مخالفة الزي</option>
<option>مخالفة أخرى</option>

</select>

</div>

<div>

<label>التاريخ</label>

<input type="date"
id="penaltyDate"
value="${today()}">

</div>

</div>

<label>التفاصيل</label>

<textarea id="penaltyDetails"></textarea>

<button class="primary"
onclick="savePenalty()">
حفظ
</button>

</div>


<div class="panel">

<h3>📋 سجل التأخيرات والجزاءات</h3>

<table>

<tr>
<th>التاريخ</th>
<th>الموظف</th>
<th>النوع</th>
<th>التفاصيل</th>
</tr>

${
penalties.slice().reverse().map(p=>`

<tr>

<td>${esc(p.date)}</td>
<td>${esc(employeeName(p.code))}</td>
<td>${esc(p.type)}</td>
<td>${esc(p.details||"-")}</td>

</tr>

`).join("")
}

</table>

</div>
`;

return;
}


/* LEAVES */

if(section==="leaveRequests"){

function editEmployee(code){

const job=prompt("الوظيفة:",e.job||"");

if(job===null)return;

const department=prompt(

/* =========================================================
   KPI
========================================================= */

function calculateKPI(code){

const late=
penalties.filter(
p=>p.code===code &&
p.type==="تأخير"
).length;

const breakLate=
penalties.filter(
p=>p.code===code &&
p.type==="تأخير من البريك"
).length;

const penaltiesCount=
penalties.filter(
p=>p.code===code &&
p.type==="جزاء"
).length;

const uniform=
penalties.filter(
p=>p.code===code &&
p.type==="مخالفة الزي"
).length;


/*
   كل مخالفة لها خصم من 100
*/

let score=100;

score-=late*2;
score-=breakLate*2;
score-=penaltiesCount*5;
score-=uniform*3;

if(score<0)score=0;

return{
late,
breakLate,
penalties:penaltiesCount,
uniform,
kpi:score
};

}
