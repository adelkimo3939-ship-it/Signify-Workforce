<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075BFF">
<title>Signify Workforce</title><style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}
body{margin:0;background:#f4f7fb;color:#172033}
.hidden{display:none!important}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#075BFF,#00358f)}
.login-box{width:100%;max-width:430px;background:#fff;border-radius:25px;padding:30px 22px;box-shadow:0 15px 45px rgba(0,0,0,.25)}
.logo{text-align:center;font-size:30px;font-weight:bold;color:#075BFF;margin-bottom:5px}
.subtitle{text-align:center;color:#777;margin-bottom:25px}
label{display:block;margin:12px 0 7px;font-weight:bold}
input,select,textarea{width:100%;border:1px solid #d7dce5;border-radius:12px;padding:12px;font-size:16px;background:#fff}
textarea{min-height:100px;resize:vertical}
.primary,.secondary,.danger,.success{border-radius:12px;padding:12px 15px;font-size:16px;border:0}
.primary{width:100%;background:#075BFF;color:#fff;margin-top:15px}
.secondary{background:#fff;color:#075BFF;border:1px solid #075BFF}
.danger{background:#e53935;color:#fff}
.success{background:#16a05d;color:#fff}
.warning{background:#f5b400;color:#fff;border:0}
.app{min-height:100vh}
.topbar{background:#075BFF;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.topbar h2{margin:0;font-size:21px}
.logout{background:#fff;color:#075BFF;border:0;padding:9px 14px;border-radius:10px}
.container{max-width:1150px;margin:auto;padding:18px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 14px rgba(0,0,0,.06)}
.card-title{color:#697386;font-size:14px}
.number{font-size:29px;font-weight:bold;margin-top:8px;color:#075BFF}
.section{margin-top:20px}
.panel{background:#fff;padding:18px;border-radius:18px;box-shadow:0 3px 14px rgba(0,0,0,.06);margin-bottom:15px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu button{padding:15px;border:0;border-radius:14px;background:#fff;color:#075BFF;font-size:16px;box-shadow:0 3px 12px rgba(0,0,0,.07)}
table{width:100%;border-collapse:collapse;margin-top:12px;background:#fff;overflow:hidden}
th,td{border-bottom:1px solid #eee;padding:10px 7px;text-align:center;font-size:14px}
th{background:#f0f4fa}
.notice{background:#fff6d8;border-right:5px solid #f5b400;padding:12px;border-radius:10px;margin-bottom:10px}
.empty{text-align:center;color:#777;padding:20px}
.kpi-box{background:linear-gradient(135deg,#075BFF,#00358f);color:#fff;border-radius:22px;padding:22px;text-align:center;margin-bottom:15px}
.kpi-number{font-size:58px;font-weight:bold}
.kpi-title{font-size:17px;opacity:.9}
.badge{display:inline-block;padding:6px 10px;border-radius:20px;font-size:13px}
.badge-green{background:#dff7ea;color:#087c45}
.badge-red{background:#ffe1e1;color:#b30000}
.badge-yellow{background:#fff2c2;color:#805d00}
.small-btn{padding:7px 10px;border:0;border-radius:8px;font-size:13px}
.employee-kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi-mini{background:#fff;border-radius:15px;padding:15px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.06)}
.kpi-mini b{font-size:25px;color:#075BFF;display:block;margin-top:5px}
.search-box{margin-bottom:12px}
hr{border:0;border-top:1px solid #eee;margin:18px 0}

@media(max-width:700px){
.cards{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:1fr}
.menu{grid-template-columns:1fr}
.employee-kpi-grid{grid-template-columns:1fr}
.container{padding:12px}
table{display:block;overflow-x:auto;white-space:nowrap}
th,td{padding:8px 5px}
.kpi-number{font-size:50px}
}
</style></head><body><!-- ================= LOGIN ================= --><div id="loginPage" class="login-page">
<div class="login-box"><div class="logo">Signify Workforce</div>
<div class="subtitle">نظام إدارة الموظفين والحضور والـ KPI</div><label>نوع المستخدم</label>
<select id="loginType" onchange="updateLoginLabels()">

<option value="employee">موظف</option>
<option value="admin">مشرف</option>
<option value="viewer">قارئ</option>
</select><label id="codeLabel">كود الموظف</label>
<input id="loginCode" type="text" placeholder="اكتب الكود">

<label>كلمة المرور</label>
<input id="loginPassword" type="password" placeholder="اكتب كلمة المرور">

<button class="primary" onclick="login()">تسجيل الدخول</button>

<div id="loginMessage" style="color:#e53935;text-align:center;margin-top:12px"></div></div>
</div><!-- ================= APP ================= --><div id="app" class="app hidden"><div class="topbar">
<div>
<h2>Signify Workforce</h2>
<div id="welcome"></div>
</div>
<button class="logout" onclick="logout()">خروج</button>
</div><div class="container"><!-- ================= ADMIN ================= --><div id="adminPage" class="hidden"><div class="cards"><div class="card">
<div class="card-title">الموظفين</div>
<div class="number" id="totalEmployees">0</div>
</div><div class="card">
<div class="card-title">الحضور اليوم</div>
<div class="number" id="presentCount">0</div>
</div><div class="card">
<div class="card-title">الغياب اليوم</div>
<div class="number" id="absentCount">0</div>
</div><div class="card">
<div class="card-title">التأخير اليوم</div>
<div class="number" id="lateCount">0</div>
</div></div><div class="section">
<div class="menu"><button onclick="showAdminSection('attendance')">🕘 الحضور والانصراف</button>
<button onclick="showAdminSection('employees')">👥 الموظفين</button>
<button onclick="showAdminSection('kpi')">📊 KPI</button>
<button onclick="showAdminSection('penalties')">⚠️ التأخيرات والجزاءات</button>
<button onclick="showAdminSection('leaveRequests')">📝 طلبات الإجازة</button>
<button onclick="showAdminSection('kaizen')">💡 Kaizen</button>
<button onclick="showAdminSection('viewEmployeeAttendance')">📅 حضور الموظف الشهري</button>
<button onclick="showAdminSection('viewers')">👁️ القراء</button>
<button onclick="showAdminSection('password')">🔐 تغيير باسورد المشرف</button>

</div>
</div><div id="adminContent" class="section"></div>
</div><!-- ================= VIEWER ================= --><div id="viewerPage" class="hidden"><div class="panel">
<h3>👁️ لوحة القراءة فقط</h3>
<p>يمكنك الاطلاع على الحضور و KPI والتأخيرات والجزاءات وطلبات الإجازة وKaizen بدون تعديل.</p>
</div><div id="viewerContent"></div></div><!-- ================= EMPLOYEE ================= --><div id="employeePage" class="hidden"><div class="panel"><h3 id="employeeName"></h3>
<div id="employeeNotifications"></div></div><div id="employeeHomeKPI"></div><div class="menu"><button onclick="employeeAttendance()">🕘 حالة حضوري</button>
<button onclick="employeeKPI()">📊 KPI الخاص بي</button>
<button onclick="employeeLeave()">📝 طلب إجازة</button>
<button onclick="employeeKaizen()">💡 Kaizen</button>
<button onclick="employeePenalties()">⚠️ التأخيرات والجزاءات</button>
<button onclick="employeePassword()">🔐 تغيير الباسورد</button>

</div><div id="employeeContent" class="section"></div></div></div>
</div><script>

/* =========================================================
   DATA
========================================================= */

let employees = JSON.parse(localStorage.getItem("sw_employees")) || [];
let attendance = JSON.parse(localStorage.getItem("sw_attendance")) || [];
let penalties = JSON.parse(localStorage.getItem("sw_penalties")) || [];
let leaves = JSON.parse(localStorage.getItem("sw_leaves")) || [];
let kaizens = JSON.parse(localStorage.getItem("sw_kaizens")) || [];
let viewers = JSON.parse(localStorage.getItem("sw_viewers")) || [];

let currentUser = null;


/* =========================================================
   ADMIN DEFAULT
========================================================= */

let admin = JSON.parse(localStorage.getItem("sw_admin"));

if(!admin){
admin = {
code:"admin",
password:"1234",
name:"مشرف النظام"
};
localStorage.setItem("sw_admin",JSON.stringify(admin));
}


/* =========================================================
   HELPERS
========================================================= */

function saveData(){

localStorage.setItem("sw_employees",JSON.stringify(employees));
localStorage.setItem("sw_attendance",JSON.stringify(attendance));
localStorage.setItem("sw_penalties",JSON.stringify(penalties));
localStorage.setItem("sw_leaves",JSON.stringify(leaves));
localStorage.setItem("sw_kaizens",JSON.stringify(kaizens));
localStorage.setItem("sw_viewers",JSON.stringify(viewers));

}

function today(){
return new Date().toISOString().slice(0,10);
}

function employeeName(code){
const e = employees.find(x=>x.code===code);
return e ? e.name : code;
}

function employeeJob(code){
const e = employees.find(x=>x.code===code);
return e ? (e.job || "-") : "-";
}

function escapeHTML(value){
return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}


/* =========================================================
   LOGIN
========================================================= */

function updateLoginLabels(){

const type=document.getElementById("loginType").value;
const label=document.getElementById("codeLabel");
const input=document.getElementById("loginCode");

if(type==="employee"){
label.innerText="كود الموظف";
input.placeholder="اكتب كود الموظف";
}

if(type==="admin"){
label.innerText="كود المشرف";
input.placeholder="اكتب كود المشرف";
}

if(type==="viewer"){
label.innerText="كود القارئ";
input.placeholder="اكتب كود القارئ";
}

}


function login(){

const type=document.getElementById("loginType").value;
const code=document.getElementById("loginCode").value.trim();
const password=document.getElementById("loginPassword").value;
const message=document.getElementById("loginMessage");

message.innerText="";

if(!code || !password){
message.innerText="اكتب الكود وكلمة المرور";
return;
}


/* ADMIN */

if(type==="admin"){

if(code===admin.code && password===admin.password){

currentUser={
type:"admin",
code:admin.code,
name:admin.name
};

openApp();
return;

}

message.innerText="كود المشرف أو كلمة المرور غير صحيحة";
return;
}


/* EMPLOYEE */

if(type==="employee"){

const e=employees.find(x=>x.code===code && x.password===password);

if(!e){
message.innerText="كود الموظف أو كلمة المرور غير صحيحة";
return;
}

currentUser={
type:"employee",
code:e.code,
name:e.name
};

openApp();
return;

}


/* VIEWER */

if(type==="viewer"){

const v=viewers.find(x=>x.code===code && x.password===password);

if(!v){
message.innerText="بيانات القارئ غير صحيحة";
return;
}

currentUser={
type:"viewer",
code:v.code,
name:v.name
};

openApp();
return;

}

}


/* =========================================================
   OPEN APP
========================================================= */

function openApp(){

document.getElementById("loginPage").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

document.getElementById("welcome").innerText=currentUser.name;

document.getElementById("adminPage").classList.add("hidden");
document.getElementById("employeePage").classList.add("hidden");
document.getElementById("viewerPage").classList.add("hidden");

if(currentUser.type==="admin"){

document.getElementById("adminPage").classList.remove("hidden");

updateDashboard();
showAdminSection("attendance");

}

if(currentUser.type==="employee"){

document.getElementById("employeePage").classList.remove("hidden");

loadEmployee();

}

if(currentUser.type==="viewer"){

document.getElementById("viewerPage").classList.remove("hidden");

loadViewer();

}

}


/* =========================================================
   LOGOUT
========================================================= */

function logout(){

currentUser=null;

document.getElementById("app").classList.add("hidden");
document.getElementById("loginPage").classList.remove("hidden");

document.getElementById("loginCode").value="";
document.getElementById("loginPassword").value="";
document.getElementById("loginMessage").innerText="";

}


/* =========================================================
   DASHBOARD
========================================================= */

function updateDashboard(){

const d=today();

const present=attendance.filter(a=>a.date===d && a.status==="حضور").length;

const absent=attendance.filter(a=>a.date===d && a.status==="غياب").length;

const late=attendance.filter(a=>a.date===d && a.late===true).length;

document.getElementById("totalEmployees").innerText=employees.length;
document.getElementById("presentCount").innerText=present;
document.getElementById("absentCount").innerText=absent;
document.getElementById("lateCount").innerText=late;

}


/* =========================================================
   ADMIN SECTIONS
========================================================= */

function showAdminSection(section){

const box=document.getElementById("adminContent");


/* ================= EMPLOYEES ================= */

if(section==="employees"){

box.innerHTML=`

<div class="panel">

<h3>➕ إضافة موظف جديد</h3>

<div class="grid">

<div>
<label>اسم الموظف</label>
<input id="newName">
</div>

<div>
<label>كود الموظف</label>
<input id="newCode">
</div>

<div>
<label>الباسورد</label>
<input id="newPassword" value="1234">
</div>

<div>
<label>الوظيفة</label>
<input id="newJob" placeholder="مثال: Operator / Technician">
</div>

<div>
<label>القسم</label>
<input id="newDepartment">
</div>

</div>

<button class="primary" onclick="addEmployee()">إضافة الموظف</button>

</div>

<div class="panel">

<h3>👥 قائمة الموظفين</h3>

<table>

<tr>
<th>الكود</th>
<th>الاسم</th>
<th>الوظيفة</th>
<th>القسم</th>
<th>الباسورد</th>
<th>إجراء</th>
</tr>

${employees.length===0
?
`<tr><td colspan="6" class="empty">لا يوجد موظفين</td></tr>`
:
employees.map(e=>`

<tr>

<td>${escapeHTML(e.code)}</td>
<td>${escapeHTML(e.name)}</td>
<td>${escapeHTML(e.job||"-")}</td>
<td>${escapeHTML(e.department||"-")}</td>
<td>${escapeHTML(e.password)}</td>

<td>
<button class="danger small-btn" onclick="deleteEmployee('${escapeHTML(e.code)}')">
حذف
</button>
</td>

</tr>

`).join("")}

</table>

</div>

`;

return;
}


/* ================= ATTENDANCE ================= */

if(section==="attendance"){

box.innerHTML=`

<div class="panel">

<h3>🕘 تسجيل حالة الموظف</h3>

<div class="grid">

<div>

<label>الموظف</label>

<select id="attendanceEmployee">

${employees.map(e=>`
<option value="${escapeHTML(e.code)}">
${escapeHTML(e.code)} - ${escapeHTML(e.name)}
</option>
`).join("")}

</select>

</div>

<div>

<label>التاريخ</label>

<input type="date" id="attendanceDate" value="${today()}">

</div>

<div>

<label>وقت الحضور</label>

<input type="time" id="attendanceTime" value="08:00">

</div>

<div>

<label>الحالة</label>

<select id="attendanceStatus">

<option>حضور</option>
<option>غياب</option>
<option>مرضي</option>
<option>عارضة</option>
<option>إجازة</option>

</select>

</div>

<div>

<label>تأخير</label>

<select id="attendanceLate">

<option value="no">لا</option>
<option value="yes">نعم</option>

</select>

</div>

</div>

<button class="primary" onclick="saveAttendance()">حفظ الحالة</button>

</div>


<div class="panel">

<h3>📋 آخر التسجيلات</h3>

<table>

<tr>
<th>التاريخ</th>
<th>الموظف</th>
<th>الوظيفة</th>
<th>الحالة</th>
<th>الوقت</th>
<th>تأخير</th>
</tr>

${attendance.length===0
?
`<tr><td colspan="6" class="empty">لا توجد تسجيلات</td></tr>`
:
attendance.slice().reverse().map(a=>`

<tr>
<td>${escapeHTML(a.date)}</td>
<td>${escapeHTML(employeeName(a.code))}</td>
<td>${escapeHTML(employeeJob(a.code))}</td>
<td>${escapeHTML(a.status)}</td>
<td>${escapeHTML(a.time||"-")}</td>
<td>${a.late?"نعم":"لا"}</td>
</tr>

`).join("")}

</table>

</div>

`;

return;
}


/* ================= MONTHLY ATTENDANCE ================= */

if(section==="viewEmployeeAttendance"){

box.innerHTML=`

<div class="panel">

<h3>📅 حضور موظف على مدار الشهر</h3>

<label>اختر الموظف</label>

<select id="monthlyEmployee" onchange="renderMonthlyAttendance()">

${employees.map(e=>`
<option value="${escapeHTML(e.code)}">
${escapeHTML(e.code)} - ${escapeHTML(e.name)}
</option>
`).join("")}

</select>

<label>الشهر</label>

<input type="month" id="monthlyMonth" value="${today().slice(0,7)}" onchange="renderMonthlyAttendance()">

</div>

<div id="monthlyAttendanceResult"></div>

`;

renderMonthlyAttendance();
return;
}


/* ================= PENALTIES ================= */

if(section==="penalties"){

box.innerHTML=`

<div class="panel">

<h3>⚠️ تسجيل تأخير / جزاء / مخالفة</h3>

<label>الموظف</label>

<select id="penaltyEmployee">

${employees.map(e=>`
<option value="${escapeHTML(e.code)}">
${escapeHTML(e.code)} - ${escapeHTML(e.name)}
</option>
`).join("")}

</select>

<label>النوع</label>

<select id="penaltyType">

<option>تأخير</option>
<option>تأخير من البريك</option>
<option>جزاء</option>
<option>مخالفة الزي</option>
<option>مخالفة أخرى</option>

</select>

<label>التاريخ</label>

<input type="date" id="penaltyDate" value="${today()}">

<label>التفاصيل</label>

<textarea id="penaltyDetails"></textarea><button class="primary" onclick="savePenalty()">
حفظ
</button></div><div class="panel"><h3>📋 السجل</h3><table><tr>
<th>التاريخ</th>
<th>الموظف</th>
<th>النوع</th>
<th>التفاصيل</th>
</tr>${penalties.length===0
?
"<tr><td colspan="4" class="empty">لا يوجد سجل</td></tr>"
:
penalties.slice().reverse().map(p=>`

<tr>
<td>${escapeHTML(p.date)}</td>
<td>${escapeHTML(employeeName(p.code))}</td>
<td>${escapeHTML(p.type)}</td>
<td>${escapeHTML(p.details||"-")}</td>
</tr>`).join("")}

</table></div>`;

return;
}

/* ================= LEAVES ================= */

if(section==="leaveRequests"){

box.innerHTML=`

<div class="panel"><h3>📝 طلبات الإجازة</h3><table><tr>
<th>الموظف</th>
<th>من</th>
<th>إلى</th>
<th>النوع</th>
<th>السبب</th>
<th>الحالة</th>
</tr>${leaves.length===0
?
"<tr><td colspan="6" class="empty">لا توجد طلبات إجازة</td></tr>"
:
leaves.slice().reverse().map(l=>{

const index=leaves.indexOf(l);

return `

<tr><td>${escapeHTML(employeeName(l.code))}</td>
<td>${escapeHTML(l.from)}</td>
<td>${escapeHTML(l.to)}</td>
<td>${escapeHTML(l.type)}</td>
<td>${escapeHTML(l.reason)}</td><td>${
l.status==="معلق"

?

"<button class="success small-btn" onclick="approveLeave(${index})">موافقة</button> <button class="danger small-btn" onclick="rejectLeave(${index})">رفض</button>"

:

escapeHTML(l.status)

}

</td></tr>`;

}).join("")}

</table></div>`;

return;
}

/* ================= KAIZEN ================= */

if(section==="kaizen"){

box.innerHTML=`

<div class="panel"><h3>💡 أفكار Kaizen</h3><table><tr>
<th>الموظف</th>
<th>الفكرة</th>
<th>التأثير</th>
<th>التاريخ</th>
<th>الحالة</th>
</tr>${kaizens.length===0
?
"<tr><td colspan="5" class="empty">لا توجد أفكار Kaizen</td></tr>"
:
kaizens.slice().reverse().map(k=>`

<tr><td>${escapeHTML(employeeName(k.code))}</td>
<td>${escapeHTML(k.idea)}</td>
<td>${escapeHTML(k.impact)}</td>
<td>${escapeHTML(k.date)}</td>
<td>${escapeHTML(k.status||"جديدة")}</td></tr>`).join("")}

</table></div>`;

return;
}

/* ================= KPI ================= */

if(section==="kpi"){

box.innerHTML=`

<div class="panel"><h3>📊 KPI الموظفين</h3><table><tr>
<th>الكود</th>
<th>الموظف</th>
<th>الوظيفة</th>
<th>التأخير</th>
<th>تأخير البريك</th>
<th>الجزاءات</th>
<th>الزي</th>
<th>KPI</th>
</tr>${employees.length===0
?
"<tr><td colspan="8" class="empty">لا يوجد موظفين</td></tr>"
:
employees.map(e=>{

const r=calculateKPI(e.code);

return `

<tr><td>${escapeHTML(e.code)}</td>
<td>${escapeHTML(e.name)}</td>
<td>${escapeHTML(e.job||"-")}</td>
<td>${r.late}</td>
<td>${r.breakLate}</td>
<td>${r.penalties}</td>
<td>${r.uniform}</td><td>
<b>${r.kpi}%</b>
</td></tr>`;

}).join("")}

</table></div>`;

return;
}

/* ================= VIEWERS ================= */

if(section==="viewers"){

box.innerHTML=`

<div class="panel"><h3>👁️ إضافة قارئ</h3><div class="grid"><div>

/* =========================================================
KPI
========================================================= */

function calculateKPI(code){

const late=penalties.filter(
p=>p.code===code && p.type==="تأخير"
).length;

const breakLate=penalties.filter(
p=>p.code===code && p.type==="تأخير من البريك"
).length;

const penalty=penalties.filter(
p=>p.code===code && p.type==="جزاء"
).length;

const uniform=penalties.filter(
p=>p.code===code && p.type==="مخالفة الزي"
).length;

/*
نظام KPI:
يبدأ من 100
كل تأخير = -2
تأخير من البريك = -2
جزاء = -10
مخالفة زي = -3
*/

let score=100;

score-=late2;
score-=breakLate2;
score-=penalty10;
score-=uniform3;

score=Math.max(0,Math.min(100,score));

return{
late,
breakLate,
penalties:penalty,
uniform,
kpi:score
};

}
