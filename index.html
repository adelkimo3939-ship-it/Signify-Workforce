<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#075BFF">
<title>Signify Workforce</title>

<style>
*{box-sizing:border-box;font-family:Arial,Tahoma,sans-serif}
body{margin:0;background:#f4f7fb;color:#172033}
.hidden{display:none!important}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}

.login-page{
min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:20px;background:linear-gradient(135deg,#075BFF,#00358f)
}
.login-box{
width:100%;max-width:430px;background:#fff;border-radius:25px;
padding:30px 22px;box-shadow:0 15px 45px rgba(0,0,0,.25)
}
.logo{text-align:center;font-size:30px;font-weight:bold;color:#075BFF}
.subtitle{text-align:center;color:#777;margin:7px 0 25px}

label{display:block;margin:12px 0 7px;font-weight:bold}
input,select,textarea{
width:100%;border:1px solid #d7dce5;border-radius:12px;
padding:13px;font-size:16px;background:#fff
}
textarea{min-height:100px;resize:vertical}

button{
border:0;border-radius:12px;padding:11px 15px;font-size:15px
}
.primary{
width:100%;background:#075BFF;color:#fff;padding:14px;
font-size:17px;margin-top:18px
}
.secondary{
width:100%;background:#fff;color:#075BFF;
border:1px solid #075BFF;margin-top:10px
}
.success{background:#16a05d!important;color:#fff!important}
.danger{background:#e53935!important;color:#fff!important}
.warning{background:#f5b400!important;color:#fff!important}

.topbar{
background:#075BFF;color:#fff;padding:17px 20px;
display:flex;justify-content:space-between;align-items:center
}
.topbar h2{margin:0;font-size:21px}
.logout{background:#fff;color:#075BFF}

.container{max-width:1150px;margin:auto;padding:18px}

.cards{
display:grid;grid-template-columns:repeat(4,1fr);gap:12px
}
.card{
background:#fff;border-radius:18px;padding:18px;
box-shadow:0 3px 14px rgba(0,0,0,.06)
}
.card-title{color:#697386;font-size:14px}
.number{font-size:30px;font-weight:bold;margin-top:8px;color:#075BFF}

.panel{
background:#fff;padding:18px;border-radius:18px;
box-shadow:0 3px 14px rgba(0,0,0,.06);margin-bottom:15px
}
.section{margin-top:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.menu button{
background:#fff;color:#075BFF;padding:15px;
box-shadow:0 3px 12px rgba(0,0,0,.07)
}

table{
width:100%;border-collapse:collapse;margin-top:12px;background:#fff
}
th,td{
border-bottom:1px solid #eee;padding:10px 7px;
text-align:center;font-size:14px
}
th{background:#f0f4fa}

.notice{
background:#fff6d8;border-right:5px solid #f5b400;
padding:12px;border-radius:10px;margin-bottom:10px
}
.empty{text-align:center;color:#777;padding:20px}

.kpi-box{
background:linear-gradient(135deg,#075BFF,#00358f);
color:#fff;border-radius:22px;padding:22px;
text-align:center;margin-bottom:15px
}
.kpi-number{font-size:55px;font-weight:bold}

.badge{
display:inline-block;padding:5px 9px;border-radius:8px;
font-size:12px;background:#eee
}
.badge-green{background:#d9f7e7;color:#08783f}
.badge-red{background:#ffe0e0;color:#a40000}
.badge-yellow{background:#fff0bd;color:#8a6200}

.small-btn{padding:7px 10px;font-size:13px}

@media(max-width:700px){
.cards{grid-template-columns:repeat(2,1fr)}
.grid,.menu{grid-template-columns:1fr}
.container{padding:12px}
table{display:block;overflow-x:auto;white-space:nowrap}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">
<div class="login-box">

<div class="logo">Signify Workforce</div>
<div class="subtitle">نظام إدارة الموظفين والحضور والـ KPI</div>

<label>نوع المستخدم</label>
<select id="loginType" onchange="updateLoginLabels()">
<option value="employee">موظف</option>
<option value="admin">مشرف</option>
<option value="viewer">قراءة فقط</option>
</select>

<label id="codeLabel">كود الموظف</label>
<input id="loginCode" type="text" placeholder="اكتب الكود">

<label>كلمة المرور</label>
<input id="loginPassword" type="password" placeholder="اكتب كلمة المرور">

<button class="primary" onclick="login()">تسجيل الدخول</button>

<div id="loginMessage" style="color:#e53935;text-align:center;margin-top:12px"></div>

</div>
</div>


<!-- APP -->
<div id="app" class="hidden">

<div class="topbar">
<div>
<h2>Signify Workforce</h2>
<div id="welcome"></div>
</div>
<button class="logout" onclick="logout()">خروج</button>
</div>

<div class="container">

<!-- ADMIN -->
<div id="adminPage" class="hidden">

<div class="cards">
<div class="card">
<div class="card-title">الموظفين</div>
<div class="number" id="totalEmployees">0</div>
</div>

<div class="card">
<div class="card-title">الحضور اليوم</div>
<div class="number" id="presentCount">0</div>
</div>

<div class="card">
<div class="card-title">الغياب اليوم</div>
<div class="number" id="absentCount">0</div>
</div>

<div class="card">
<div class="card-title">التأخير اليوم</div>
<div class="number" id="lateCount">0</div>
</div>
</div>

<div class="section menu">

<button onclick="showAdminSection('attendance')">🕘 الحضور والانصراف</button>
<button onclick="showAdminSection('employees')">👥 الموظفين</button>
<button onclick="showAdminSection('kpi')">📊 KPI</button>
<button onclick="showAdminSection('penalties')">⚠️ التأخيرات والجزاءات</button>
<button onclick="showAdminSection('leaveRequests')">📝 طلبات الإجازة</button>
<button onclick="showAdminSection('kaizen')">💡 Kaizen</button>
<button onclick="showAdminSection('password')">🔐 تغيير باسورد المشرف</button>

</div>

<div id="adminContent" class="section"></div>
</div>


<!-- VIEWER -->
<div id="viewerPage" class="hidden">

<div class="panel">
<h3>👁️ لوحة القراءة فقط</h3>
<p>يمكنك الاطلاع على الحضور و KPI والتأخيرات والجزاءات وطلبات الإجازة وKaizen.</p>
</div>

<div class="menu">
<button onclick="viewerAttendance()">🕘 الحضور</button>
<button onclick="viewerKPI()">📊 KPI</button>
<button onclick="viewerPenalties()">⚠️ الجزاءات</button>
<button onclick="viewerLeaves()">📝 الإجازات</button>
<button onclick="viewerKaizen()">💡 Kaizen</button>
</div>

<div id="viewerContent" class="section"></div>
</div>


<!-- EMPLOYEE -->
<div id="employeePage" class="hidden">

<div class="panel">
<h3 id="employeeName"></h3>
<div id="employeeNotifications"></div>
</div>

<div id="employeeHomeKPI"></div>

<div class="menu">
<button onclick="employeeAttendance()">🕘 حضوري الشهري</button>
<button onclick="employeeKPI()">📊 KPI الخاص بي</button>
<button onclick="employeeLeave()">📝 طلب إجازة</button>
<button onclick="employeeKaizen()">💡 Kaizen</button>
<button onclick="employeePassword()">🔐 تغيير الباسورد</button>
</div>

<div id="employeeContent" class="section"></div>
</div>

</div>
</div>


<script>

/* =========================
   DATA
========================= */

let employees = JSON.parse(localStorage.getItem("sw_employees") || "[]");
let attendance = JSON.parse(localStorage.getItem("sw_attendance") || "[]");
let penalties = JSON.parse(localStorage.getItem("sw_penalties") || "[]");
let leaves = JSON.parse(localStorage.getItem("sw_leaves") || "[]");
let kaizens = JSON.parse(localStorage.getItem("sw_kaizens") || "[]");

let currentUser = null;

let admin = JSON.parse(localStorage.getItem("sw_admin") || "null");

if(!admin){
admin={
code:"admin",
password:"1234",
name:"مشرف النظام"
};
localStorage.setItem("sw_admin",JSON.stringify(admin));
}


/* =========================
   SAVE
========================= */

function saveData(){

localStorage.setItem("sw_employees",JSON.stringify(employees));
localStorage.setItem("sw_attendance",JSON.stringify(attendance));
localStorage.setItem("sw_penalties",JSON.stringify(penalties));
localStorage.setItem("sw_leaves",JSON.stringify(leaves));
localStorage.setItem("sw_kaizens",JSON.stringify(kaizens));

}


/* =========================
   DATE
========================= */

function today(){
return new Date().toISOString().slice(0,10);
}

function monthNow(){
return new Date().toISOString().slice(0,7);
}


/* =========================
   LOGIN
========================= */

function updateLoginLabels(){

const type=document.getElementById("loginType").value;
const label=document.getElementById("codeLabel");
const input=document.getElementById("loginCode");

if(type==="admin"){
label.innerText="كود المشرف";
input.placeholder="admin";
}
else if(type==="viewer"){
label.innerText="كود القارئ";
input.placeholder="viewer";
}
else{
label.innerText="كود الموظف";
input.placeholder="اكتب الكود";
}

}


function login(){

const type=document.getElementById("loginType").value;
const code=document.getElementById("loginCode").value.trim();
const password=document.getElementById("loginPassword").value;
const msg=document.getElementById("loginMessage");

msg.innerText="";

if(!code || !password){
msg.innerText="اكتب الكود وكلمة المرور";
return;
}


/* ADMIN */

if(type==="admin"){

if(code===admin.code && password===admin.password){

currentUser={
type:"admin",
code:admin.code,
name:admin.name
};

openApp();
return;

}

msg.innerText="بيانات المشرف غير صحيحة";
return;
}


/* VIEWER */

if(type==="viewer"){

if(code==="viewer" && password==="1234"){

currentUser={
type:"viewer",
code:"viewer",
name:"قارئ البيانات"
};

openApp();
return;

}

msg.innerText="بيانات القارئ غير صحيحة";
return;
}


/* EMPLOYEE */

const employee=employees.find(e=>
String(e.code)===String(code) &&
String(e.password)===String(password)
);

if(!employee){
msg.innerText="كود الموظف أو كلمة المرور غير صحيحة";
return;
}

currentUser={
type:"employee",
code:employee.code,
name:employee.name
};

openApp();

}


/* =========================
   OPEN APP
========================= */

function openApp(){

document.getElementById("loginPage").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");

document.getElementById("adminPage").classList.add("hidden");
document.getElementById("employeePage").classList.add("hidden");
document.getElementById("viewerPage").classList.add("hidden");

document.getElementById("welcome").innerText=currentUser.name;

if(currentUser.type==="admin"){

document.getElementById("adminPage").classList.remove("hidden");
updateDashboard();
showAdminSection("attendance");

}

if(currentUser.type==="employee"){

document.getElementById("employeePage").classList.remove("hidden");
loadEmployee();

}

if(currentUser.type==="viewer"){

document.getElementById("viewerPage").classList.remove("hidden");
viewerAttendance();

}

}


function logout(){

currentUser=null;

document.getElementById("app").classList.add("hidden");
document.getElementById("loginPage").classList.remove("hidden");

document.getElementById("loginCode").value="";
document.getElementById("loginPassword").value="";
document.getElementById("loginMessage").innerText="";

}


/* =========================
   HELPERS
========================= */

function employeeName(code){

const e=employees.find(x=>String(x.code)===String(code));
return e ? e.name : code;
}

function employeeJob(code){

const e=employees.find(x=>String(x.code)===String(code));
return e ? (e.job || "-") : "-";
}

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   DASHBOARD
========================= */

function updateDashboard(){

const d=today();

document.getElementById("totalEmployees").innerText=employees.length;

document.getElementById("presentCount").innerText=
attendance.filter(a=>a.date===d && a.status==="حضور").length;

document.getElementById("absentCount").innerText=
attendance.filter(a=>a.date===d && a.status==="غياب").length;

document.getElementById("lateCount").innerText=
attendance.filter(a=>a.date===d && a.late===true).length;

}


/* =========================
   ADMIN EMPLOYEES
========================= */

function addEmployee(){

const name=document.getElementById("newName").value.trim();
const code=document.getElementById("newCode").value.trim();
const password=document.getElementById("newPassword").value;
const department=document.getElementById("newDepartment").value.trim();
const job=document.getElementById("newJob").value.trim();

if(!name || !code || !password){
alert("اكتب الاسم والكود والباسورد");
return;
}

if(employees.some(e=>String(e.code)===String(code))){
alert("الكود موجود بالفعل");
return;
}

employees.push({
name,
code,
password,
department,
job
});

saveData();

alert("تم إضافة الموظف بنجاح");

showAdminSection("employees");
updateDashboard();

}


function deleteEmployee(code){

if(!confirm("هل تريد حذف الموظف؟")) return;

employees=employees.filter(e=>String(e.code)!==String(code));

saveData();

showAdminSection("employees");
updateDashboard();

}


/* =========================
   ADMIN SECTIONS
========================= */

function showAdminSection(section){

const box=document.getElementById("adminContent");


/* EMPLOYEES */

if(section==="employees"){

box.innerHTML=`

<div class="panel">

<h3>➕ إضافة موظف</h3>

<div class="grid">

<div>
<label>اسم الموظف</label>
<input id="newName">
</div>

<div>
<label>كود الموظف</label>
<input id="newCode">
</div>

<div>
<label>الباسورد</label>
<input id="newPassword" value="1234">
</div>

<div>
<label>القسم</label>
<input id="newDepartment">
</div>

<div>
<label>الوظيفة</label>
<input id="newJob" placeholder="مثال: عامل / فني / قائد فريق">
</div>

</div>

<button class="primary" onclick="addEmployee()">إضافة الموظف</button>

</div>


<div class="panel">

<h3>👥 الموظفين</h3>

<table>

<tr>
<th>الكود</th>
<th>الاسم</th>
<th>الوظيفة</th>
<th>القسم</th>
<th>الباسورد</th>
<th>حذف</th>
</tr>

${employees.map(e=>`

<tr>

<td>${escapeHTML(e.code)}</td>
<td>${escapeHTML(e.name)}</td>
<td>${escapeHTML(e.job || "-")}</td>
<td>${escapeHTML(e.department || "-")}</td>
<td>${escapeHTML(e.password)}</td>

<td>
<button class="danger small-btn"
onclick="deleteEmployee('${String(e.code).replace(/'/g,"\\'")}')">
حذف
</button>
</td>

</tr>

`).join("")}

</table>

</div>

`;

return;
}


/* ATTENDANCE */

if(section==="attendance"){

box.innerHTML=`

<div class="panel">

<h3>🕘 تسجيل حضور / حالة يوم</h3>

<label>الموظف</label>

<select id="attendanceEmployee">

${employees.map(e=>`
<option value="${escapeHTML(e.code)}">
${escapeHTML(e.code)} - ${escapeHTML(e.name)}
</option>
`).join("")}

</select>

<label>التاريخ</label>
<input type="date" id="attendanceDate" value="${today()}">

<label>وقت الحضور</label>
<input type="time" id="attendanceTime" value="08:00">

<label>الحالة</label>

<select id="attendanceStatus">
<option>حضور</option>
<option>غياب</option>
<option>مرضي</option>
<option>عارضة</option>
<option>إجازة</option>
</select>

<label>التأخير</label>

<select id="attendanceLate">
<option value="no">لا</option>
<option value="yes">نعم</option>
</select>

<button class="primary" onclick="saveAttendance()">
حفظ الحالة
</button>

</div>


<div class="panel">

<h3>📅 سجل الحضور الشهري</h3>

<div class="grid">

<div>
<label>اختر الموظف</label>
<select id="monthlyEmployee">
${employees.map(e=>`
<option value="${escapeHTML(e.code)}">
${escapeHTML(e.code)} - ${escapeHTML(e.name)}
</option>
`).join("")}
</select>
</div>

<div>
<label>الشهر</label>
<input type="month" id="monthlyMonth" value="${monthNow()}">
</div>

</div>

<button class="secondary" onclick="showMonthlyAttendance()">
عرض الشهر
</button>

<div id="monthlyAttendanceResult"></div>

</div>

<div class="panel">

<h3>آخر التسجيلات</h3>

<table>

<tr>
<th>التاريخ</th>
<th>الموظف</th>
<th>الحالة</th>
<th>الوقت</th>
<th>تأخير</th>
</tr>

${attendance.slice().reverse().slice(0,100).map(a=>`

<tr>
<td>${escapeHTML(a.date)}</td>
<td>${escapeHTML(employeeName(a.code))}</td>
<td>${escapeHTML(a.status)}</td>
<td>${escapeHTML(a.time || "-")}</td>
<td>${a.late ? "نعم" : "لا"}</td>
</tr>

`).join("")}

</table>

</div>

`;

return;
}


/* PENALTIES */

if(section==="penalties"){

box.innerHTML=`

<div class="panel">

<h3>⚠️ إضافة تأخير / جزاء / مخالفة</h3>

<label>الموظف</label>

<select id="penaltyEmployee">

${employees.map(e=>`
<option value="${escapeHTML(e.code)}">
${escapeHTML(e.code)} - ${escapeHTML(e.name)}
</option>
`).join("")}

</select>

<label>النوع</label>

<select id="penaltyType">
<option>تأخير</option>
<option>تأخير من البريك</option>
<option>جزاء</option>
<option>مخالفة الزي</option>
<option>مخالفة أخرى</option>
</select>

<label>التاريخ</label>
<input type="date" id="penaltyDate" value="${today()}">

<label>التفاصيل</label>
<textarea id="penaltyDetails"></textarea>

<button class="primary" onclick="savePenalty()">
حفظ وإظهار إشعار للموظف
</button>

</div>


<div class="panel">

<h3>السجل</h3>

<table>

<tr>
<th>التاريخ</th>
<th>الموظف</th>
<th>النوع</th>
<th>التفاصيل</th>
</tr>

${penalties.slice().reverse().map(p=>`

<tr>
<td>${escapeHTML(p.date)}</td>
<td>${escapeHTML(employeeName(p.code))}</td>
<td>${escapeHTML(p.type)}</td>
<td>${escapeHTML(p.details)}</td>
</tr>

`).join("")}

</table>

</div>

`;

return;
}


/* LEAVES */

if(section==="leaveRequests"){

box.innerHTML=`

<div class="panel">

<h3>📝 طلبات الإجازة</h3>

${leaves.length===0
?
`<div class="empty">لا توجد طلبات إجازة</div>`
:
`

<table>

<tr>
<th>الموظف</th>
<th>من</th>
<th>إلى</th>
<th>النوع</th>
<th>السبب</th>
<th>الحالة</th>
</tr>

${leaves.slice().reverse().map((l,index)=>{

const realIndex=leaves.length-1-index;

return `

<tr>

<td>${escapeHTML(employeeName(l.code))}</td>
<td>${escapeHTML(l.from)}</td>
<td>${escapeHTML(l.to)}</td>
<td>${escapeHTML(l.type)}</td>
<td>${escapeHTML(l.reason)}</td>

<td>

${l.status==="معلق"

?

`
<button class="success small-btn"
onclick="approveLeave(${realIndex})">
موافقة
</button>

<button class="danger small-btn"
onclick="rejectLeave(${realIndex})">
رفض
</button>
`

:

`<span class="badge">${escapeHTML(l.status)}</span>`

}

</td>

</tr>

`;

}).join("")}

</table>
`}

</div>

`;

return;
}


/* KAIZEN */

if(section==="kaizen"){

box.innerHTML=`

<div class="panel">

<h3>💡 أفكار Kaizen</h3>

${kaizens.length===0
?
`<div class="empty">لا توجد أفكار Kaizen</div>`
:
`

<table>

<tr>
<th>الموظف</th>
<th>الفكرة</th>
<th>التأثير</th>
<th>التاريخ</th>
<th>الحالة</th>
</tr>

${kaizens.slice().reverse().map((k,index)=>{

const realIndex=kaizens.length-1-index;

return `

<tr>

<td>${escapeHTML(employeeName(k.code))}</td>
<td>${escapeHTML(k.idea)}</td>
<td>${escapeHTML(k.impact)}</td>
<td>${escapeHTML(k.date)}</td>

<td>

<select onchange="updateKaizenStatus(${realIndex},this.value)">
<option ${k.status==="جديدة"?"selected":""}>جديدة</option>
<option ${k.status==="قيد الدراسة"?"selected":""}>قيد الدراسة</option>
<option ${k.status==="تم التنفيذ"?"selected":""}>تم التنفيذ</option>
<option ${k.status==="مرفوضة"?"selected":""}>مرفوضة</option>
</select>

</td>

</tr>

`;

}).join("")}

</table>
`}

</div>

`;

return;
}


/* KPI */

if(section==="kpi"){

box.innerHTML=`

<div class="panel">

<h3>📊 KPI الموظفين</h3>

<table>

<tr>
<th>الكود</th>
<th>الموظف</th>
<th>الوظيفة</th>
<th>التأخير</th>
<th>تأخير بريك</th>
<th>الجزاءات</th>
<th>الزي</th>
<th>KPI</th>
</tr>

${employees.map(e=>{

const r=calculateKPI(e.code);

return `

<tr>

/* =========================
   KPI
========================= */

function calculateKPI(code){

const late=penalties.filter(p=>p.code===code && p.type==="تأخير").length;

const breakLate=penalties.filter(
p=>p.code===code && p.type==="تأخير من البريك"
).length;

const penaltiesCount=penalties.filter(
p=>p.code===code && p.type==="جزاء"
).length;

const uniform=penalties.filter(
p=>p.code===code && p.type==="مخالفة الزي"
).length;

let score=100;

score-=late*2;
score-=breakLate*2;
score-=penaltiesCount*5;
score-=uniform*3;

score=Math.max(0,Math.min(100,score));

return{
late,
breakLate,
penalties:penaltiesCount,
uniform,
kpi:score
};

}
