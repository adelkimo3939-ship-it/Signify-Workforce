<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075BFF">
<title>Signify Workforce</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  margin:0;
  background:#f4f7fb;
  color:#172033;
}

.hidden{display:none!important}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#075BFF,#00358f);
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  border-radius:25px;
  padding:30px 22px;
  box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:bold;
  color:#075BFF;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

label{
  display:block;
  margin:12px 0 7px;
  font-weight:bold;
}

input,select,textarea{
  width:100%;
  border:1px solid #d7dce5;
  border-radius:12px;
  padding:13px;
  font-size:16px;
  background:#fff;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.primary{
  width:100%;
  border:0;
  background:#075BFF;
  color:white;
  padding:14px;
  border-radius:13px;
  font-size:17px;
  margin-top:18px;
}

.secondary{
  width:100%;
  border:1px solid #075BFF;
  background:white;
  color:#075BFF;
  padding:12px;
  border-radius:13px;
  font-size:16px;
  margin-top:10px;
}

.danger{
  background:#e53935!important;
  color:white!important;
  border:0!important;
}

.success{
  background:#16a05d!important;
  color:white!important;
  border:0!important;
}

.app{
  min-height:100vh;
}

.topbar{
  background:#075BFF;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.topbar h2{
  margin:0;
  font-size:21px;
}

.logout{
  background:white;
  color:#075BFF;
  border:0;
  padding:9px 14px;
  border-radius:10px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.card-title{
  color:#697386;
  font-size:14px;
}

.number{
  font-size:29px;
  font-weight:bold;
  margin-top:8px;
  color:#075BFF;
}

.section{
  margin-top:20px;
}

.section h3{
  margin-bottom:12px;
}

.panel{
  background:white;
  padding:18px;
  border-radius:18px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.menu button{
  padding:15px;
  border:0;
  border-radius:14px;
  background:white;
  color:#075BFF;
  font-size:16px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:12px;
  background:white;
}

th,td{
  border-bottom:1px solid #eee;
  padding:11px 7px;
  text-align:center;
  font-size:14px;
}

th{
  background:#f0f4fa;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  background:#e9eef8;
}

.notice{
  background:#fff6d8;
  border-right:5px solid #f5b400;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

.back{
  margin-bottom:12px;
}

.kaizen-impact{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:8px;
}

.impact{
  border:1px solid #ddd;
  padding:11px;
  border-radius:10px;
  background:white;
}

.impact input{
  width:auto;
  margin-left:6px;
}

@media(max-width:700px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .grid{
    grid-template-columns:1fr;
  }

  .menu{
    grid-template-columns:1fr;
  }

  .topbar{
    padding:14px;
  }

  .container{
    padding:12px;
  }

  table{
    font-size:12px;
  }

  th,td{
    padding:8px 4px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login-page">

  <div class="login-box">

    <div class="logo">Signify Workforce</div>

    <div class="subtitle">
      نظام إدارة الموظفين والحضور والـ KPI
    </div>

    <label>نوع المستخدم</label>

    <select id="loginType">
      <option value="employee">موظف</option>
      <option value="admin">مشرف</option>
      <option value="viewer">قراءة فقط</option>
    </select>

    <label id="codeLabel">كود الموظف</label>

    <input
      id="loginCode"
      type="text"
      placeholder="مثال: 1001"
    >

    <label>كلمة المرور</label>

    <input
      id="loginPassword"
      type="password"
      placeholder="كلمة المرور"
    >

    <button class="primary" onclick="login()">
      تسجيل الدخول
    </button>

    <div id="loginMessage"
         style="color:#e53935;text-align:center;margin-top:12px">
    </div>

  </div>

</div>


<!-- APP -->
<div id="app" class="app hidden">

  <div class="topbar">

    <div>
      <h2>Signify Workforce</h2>
      <div id="welcome"></div>
    </div>

    <button class="logout" onclick="logout()">
      خروج
    </button>

  </div>

  <div class="container">

    <!-- ADMIN -->
    <div id="adminPage" class="hidden">

      <div class="cards">

        <div class="card">
          <div class="card-title">الموظفين</div>
          <div class="number" id="totalEmployees">0</div>
        </div>

        <div class="card">
          <div class="card-title">الحضور اليوم</div>
          <div class="number" id="presentCount">0</div>
        </div>

        <div class="card">
          <div class="card-title">الغياب اليوم</div>
          <div class="number" id="absentCount">0</div>
        </div>

        <div class="card">
          <div class="card-title">التأخير اليوم</div>
          <div class="number" id="lateCount">0</div>
        </div>

      </div>

      <div class="section">

        <div class="menu">

          <button onclick="showAdminSection('attendance')">
            🕘 الحضور والانصراف
          </button>

          <button onclick="showAdminSection('employees')">
            👥 الموظفين
          </button>

          <button onclick="showAdminSection('kpi')">
            📊 KPI
          </button>

          <button onclick="showAdminSection('penalties')">
            ⚠️ التأخيرات والجزاءات
          </button>

          <button onclick="showAdminSection('leaveRequests')">
            📝 طلبات الإجازة
          </button>

          <button onclick="showAdminSection('kaizen')">
            💡 Kaizen
          </button>

          <button onclick="showAdminSection('password')">
            🔐 تغيير باسورد المشرف
          </button>

        </div>

      </div>

      <div id="adminContent" class="section"></div>

    </div>


    <!-- VIEWER -->
    <div id="viewerPage" class="hidden">

      <div class="panel">

        <h3>👁️ لوحة القراءة فقط</h3>

        <p>
          هذه الصلاحية تسمح بالاطلاع على البيانات فقط
          بدون إضافة أو تعديل.
        </p>

      </div>

      <div id="viewerContent"></div>

    </div>


    <!-- EMPLOYEE -->
    <div id="employeePage" class="hidden">

      <div class="panel">

        <h3 id="employeeName"></h3>

        <div id="employeeNotifications"></div>

      </div>

      <div class="menu">

        <button onclick="employeeAttendance()">
          🕘 حالة حضوري
        </button>

        <button onclick="employeeLeave()">
          📝 طلب إجازة
        </button>

        <button onclick="employeeKaizen()">
          💡 Kaizen
        </button>

        <button onclick="employeePassword()">
          🔐 تغيير الباسورد
        </button>

      </div>

      <div id="employeeContent" class="section"></div>

    </div>

  </div>

</div>


<script>

/* =========================
   DATA
========================= */

let employees =
  JSON.parse(localStorage.getItem("sw_employees")) || [];

let attendance =
  JSON.parse(localStorage.getItem("sw_attendance")) || [];

let penalties =
  JSON.parse(localStorage.getItem("sw_penalties")) || [];

let leaves =
  JSON.parse(localStorage.getItem("sw_leaves")) || [];

let kaizens =
  JSON.parse(localStorage.getItem("sw_kaizens")) || [];

let currentUser = null;


/* =========================
   DEFAULT ADMIN
========================= */

let admin =
  JSON.parse(localStorage.getItem("sw_admin"));

if(!admin){

  admin = {
    code:"admin",
    password:"1234",
    name:"مشرف النظام"
  };

  localStorage.setItem(
    "sw_admin",
    JSON.stringify(admin)
  );
}


/* =========================
   SAVE
========================= */

function saveData(){

  localStorage.setItem(
    "sw_employees",
    JSON.stringify(employees)
  );

  localStorage.setItem(
    "sw_attendance",
    JSON.stringify(attendance)
  );

  localStorage.setItem(
    "sw_penalties",
    JSON.stringify(penalties)
  );

  localStorage.setItem(
    "sw_leaves",
    JSON.stringify(leaves)
  );

  localStorage.setItem(
    "sw_kaizens",
    JSON.stringify(kaizens)
  );
}


/* =========================
   LOGIN
========================= */

function login(){

  const type =
    document.getElementById("loginType").value;

  const code =
    document.getElementById("loginCode").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  message.innerText="";

  if(!code || !password){

    message.innerText =
      "اكتب الكود وكلمة المرور";

    return;
  }


  /* ADMIN */

  if(type==="admin"){

    if(
      code===admin.code &&
      password===admin.password
    ){

      currentUser={
        type:"admin",
        code:admin.code,
        name:admin.name
      };

      openApp();

      return;

    }else{

      message.innerText =
        "كود المشرف أو كلمة المرور غير صحيحة";

      return;
    }
  }


  /* EMPLOYEE */

  if(type==="employee"){

    const employee =
      employees.find(
        e =>
        e.code===code &&
        e.password===password
      );

    if(!employee){

      message.innerText =
        "كود الموظف أو كلمة المرور غير صحيحة";

      return;
    }

    currentUser={
      type:"employee",
      code:employee.code,
      name:employee.name
    };

    openApp();

    return;
  }


  /* VIEWER */

  if(type==="viewer"){

    /*
      القراءة فقط:
      نستخدم نفس بيانات المشرف،
      ويمكن لاحقاً إضافة أكواد منفصلة
      للـ HR أو مدير الإنتاج.
    */

    if(
      code==="viewer" &&
      password==="1234"
    ){

      currentUser={
        type:"viewer",
        code:"viewer",
        name:"قارئ البيانات"
      };

      openApp();

      return;

    }else{

      message.innerText =
        "بيانات القراءة فقط غير صحيحة";

      return;
    }
  }

}


/* =========================
   OPEN APP
========================= */

function openApp(){

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("welcome")
    .innerText =
      currentUser.name;

  document
    .getElementById("adminPage")
    .classList.add("hidden");

  document
    .getElementById("employeePage")
    .classList.add("hidden");

  document
    .getElementById("viewerPage")
    .classList.add("hidden");


  if(currentUser.type==="admin"){

    document
      .getElementById("adminPage")
      .classList.remove("hidden");

    updateDashboard();

  }


  if(currentUser.type==="employee"){

    document
      .getElementById("employeePage")
      .classList.remove("hidden");

    loadEmployee();

  }


  if(currentUser.type==="viewer"){

    document
      .getElementById("viewerPage")
      .classList.remove("hidden");

    loadViewer();

  }

}


/* =========================
   LOGOUT
========================= */

function logout(){

  currentUser=null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("loginCode")
    .value="";

  document
    .getElementById("loginPassword")
    .value="";

}


/* =========================
   ADMIN DASHBOARD
========================= */

function updateDashboard(){

  const today =
    new Date().toISOString().slice(0,10);

  const present =
    attendance.filter(
      a =>
      a.date===today &&
      a.status==="حضور"
    ).length;

  const absent =
    attendance.filter(
      a =>
      a.date===today &&
      a.status==="غياب"
    ).length;

  const late =
    attendance.filter(
      a =>
      a.date===today &&
      a.late
    ).length;


  document.getElementById(
    "totalEmployees"
  ).innerText=employees.length;

  document.getElementById(
    "presentCount"
  ).innerText=present;

  document.getElementById(
    "absentCount"
  ).innerText=absent;

  document.getElementById(
    "lateCount"
  ).innerText=late;

}


/* =========================
   ADMIN SECTIONS
========================= */

function showAdminSection(section){

  const box =
    document.getElementById("adminContent");


  if(section==="employees"){

    box.innerHTML=`

      <div class="panel">

        <h3>➕ إضافة موظف</h3>

        <div class="grid">

          <div>
            <label>اسم الموظف</label>
            <input id="newName">
          </div>

          <div>
            <label>كود الموظف</label>
            <input id="newCode">
          </div>

          <div>
            <label>الباسورد</label>
            <input id="newPassword" value="1234">
          </div>

          <div>
            <label>القسم</label>
            <input id="newDepartment">
          </div>

        </div>

        <button class="primary"
          onclick="addEmployee()">
          إضافة الموظف
        </button>

      </div>

      <div class="panel">

        <h3>الموظفين</h3>

        <table>

          <tr>
            <th>الكود</th>
            <th>الاسم</th>
            <th>القسم</th>
            <th>الباسورد</th>
            <th>حذف</th>
          </tr>

          ${
            employees.map(e=>`

              <tr>

                <td>${e.code}</td>

                <td>${e.name}</td>

                <td>${e.department||"-"}</td>

                <td>${e.password}</td>

                <td>
                  <button
                    class="danger"
                    onclick="deleteEmployee('${e.code}')">
                    حذف
                  </button>
                </td>

              </tr>

            `).join("")
          }

        </table>

      </div>

    `;

    return;
  }


  if(section==="attendance"){

    box.innerHTML=`

      <div class="panel">

        <h3>🕘 تسجيل حضور / حالة يوم</h3>

        <label>الموظف</label>

        <select id="attendanceEmployee">

          ${
            employees.map(e=>
              `<option value="${e.code}">
                ${e.code} - ${e.name}
              </option>`
            ).join("")
          }

        </select>

        <label>التاريخ</label>

        <input
          type="date"
          id="attendanceDate"
          value="${new Date().toISOString().slice(0,10)}">

        <label>وقت الحضور</label>

        <input
          type="time"
          id="attendanceTime"
          value="08:00">

        <label>الحالة</label>

        <select id="attendanceStatus">

          <option>حضور</option>
          <option>غياب</option>
          <option>مرضي</option>
          <option>عارضة</option>
          <option>إجازة</option>

        </select>

        <label>هل يوجد تأخير؟</label>

        <select id="attendanceLate">
          <option value="no">لا</option>
          <option value="yes">نعم</option>
        </select>

        <button
          class="primary"
          onclick="saveAttendance()">
          حفظ الحالة
        </button>

      </div>

      <div class="panel">

        <h3>آخر التسجيلات</h3>

        <table>

          <tr>
            <th>التاريخ</th>
            <th>الموظف</th>
            <th>الحالة</th>
            <th>الوقت</th>
            <th>تأخير</th>
          </tr>

          ${
            attendance.slice(-20).reverse().map(a=>`

              <tr>
                <td>${a.date}</td>
                <td>${employeeName(a.code)}</td>
                <td>${a.status}</td>
                <td>${a.time||"-"}</td>
                <td>${a.late?"نعم":"لا"}</td>
              </tr>

            `).join("")
          }

        </table>

      </div>

    `;

    return;
  }


  if(section==="penalties"){

    box.innerHTML=`

      <div class="panel">

        <h3>⚠️ إضافة تأخير / جزاء</h3>

        <label>الموظف</label>

        <select id="penaltyEmployee">

          ${
            employees.map(e=>
              `<option value="${e.code}">
                ${e.code} - ${e.name}
              </option>`
            ).join("")
          }

        </select>

        <label>النوع</label>

        <select id="penaltyType">
          <option>تأخير</option>
          <option>تأخير من البريك</option>
          <option>جزاء</option>
          <option>مخالفة الزي</option>
          <option>مخالفة أخرى</option>
        </select>

        <label>التاريخ</label>

        <input
          type="date"
          id="penaltyDate"
          value="${new Date().toISOString().slice(0,10)}">

        <label>التفاصيل</label>

        <textarea id="penaltyDetails"></textarea>

        <button
          class="primary"
          onclick="savePenalty()">
          حفظ وإرسال إشعار للموظف
        </button>

      </div>

      <div class="panel">

        <h3>السجل</h3>

        <table>

          <tr>
            <th>التاريخ</th>
            <th>الموظف</th>
            <th>النوع</th>
            <th>التفاصيل</th>
          </tr>

          ${
            penalties.slice().reverse().map(p=>`

              <tr>
                <td>${p.date}</td>
                <td>${employeeName(p.code)}</td>
                <td>${p.type}</td>
                <td>${p.details}</td>
              </tr>

            `).join("")
          }

        </table>

      </div>

    `;

    return;
  }


  if(section==="leaveRequests"){

    box.innerHTML=`

      <div class="panel">

        <h3>📝 طلبات الإجازة</h3>

        ${
          leaves.length===0
          ?
          `<div class="empty">لا توجد طلبات إجازة</div>`
          :
          `
          <table>

            <tr>
              <th>الموظف</th>
              <th>من</th>
              <th>إلى</th>
              <th>النوع</th>
              <th>السبب</th>
              <th>الحالة</th>
            </tr>

            ${
              leaves.slice().reverse().map((l,i)=>`

                <tr>

                  <td>${employeeName(l.code)}</td>

                  <td>${l.from}</td>

                  <td>${l.to}</td>

                  <td>${l.type}</td>

                  <td>${l.reason}</td>

                  <td>

                    ${
                      l.status==="معلق"
                      ?
                      `
                      <button
                        class="success"
                        onclick="approveLeave(${leaves.length-1-i})">
                        موافقة
                      </button>

                      <button
                        class="danger"
                        onclick="rejectLeave(${leaves.length-1-i})">
                        رفض
                      </button>
                      `
                      :
                      l.status
                    }

                  </td>

                </tr>

              `).join("")
            }

          </table>
          `
        }

      </div>

    `;

    return;
  }


  if(section==="kaizen"){

    box.innerHTML=`

      <div class="panel">

        <h3>💡 أفكار Kaizen</h3>

        ${
          kaizens.length===0
          ?
          `<div class="empty">لا توجد أفكار حتى الآن</div>`
          :
          `
          <table>

            <tr>
              <th>الموظف</th>
              <th>الفكرة</th>
              <th>التأثير</th>
              <th>التاريخ</th>
            </tr>

            ${
              kaizens.slice().reverse().map(k=>`

                <tr>
                  <td>${employeeName(k.code)}</td>
                  <td>${k.idea}</td>
                  <td>${k.impact}</td>
                  <td>${k.date}</td>
                </tr>

              `).join("")
            }

          </table>
          `
        }

      </div>

    `;

    return;
  }


  if(section==="kpi"){

    box.innerHTML=`

      <div class="panel">

        <h3>📊 KPI الموظفين</h3>

        <table>

          <tr>
            <th>الكود</th>
            <th>الموظف</th>
            <th>التأخير</th>
            <th>الجزاءات</th>
            <th>KPI</th>
          </tr>

          ${
            employees.map(e=>{

              const late =
                penalties.filter(
                  p =>
                  p.code===e.code &&
                  (
                    p.type==="تأخير" ||
                    p.type==="تأخير من البريك"
                  )
                ).length;

              const penalty =
                penalties.filter(
                  p =>
                  p.code===e.code &&
                  p.type.includes("جزاء")
                ).length;

              let kpi=100;

              kpi -= late*2;
              kpi -= penalty*5;

              if(kpi<0)kpi=0;

              return`

                <tr>
                  <td>${e.code}</td>
                  <td>${e.name}</td>
                  <td>${late}</td>
                  <td>${penalty}</td>
                  <td>${kpi}%</td>
                </tr>

              `;

            }).join("")
          }

        </table>

      </div>

    `;

    return;
  }


  if(section==="password"){

    box.innerHTML=`

      <div class="panel">

        <h3>🔐 تغيير باسورد المشرف</h3>

        <label>الباسورد الحالي</label>

        <input
          type="password"
          id="oldAdminPassword">

        <label>الباسورد الجديد</label>

        <input
          type="password"
          id="newAdminPassword">

        <button
          class="primary"
          onclick="changeAdminPassword()">
          تغيير الباسورد
        </button>

      </div>

    `;

  }

}

function addEmployee(){

  const name =
    document.getElementById("newName").value.trim();

  const code =
    document.getElementById("newCode").value.trim();

  const password =
    document.getElementById("newPassword").value;

  const department =
    document.getElementById("newDepartment").value.trim();


  if(!name || !code || !password){

    alert("اكتب اسم الموظف والكود والباسورد");

    return;
  }


  if(
    employees.some(
      e=>e.code===code
    )
  ){

    alert("الكود موجود بالفعل");

    return;
  }


  employees.push({

    name,
    code,
    password,
    department

  });


  saveData();

  alert(
    "تم إضافة الموظف بنجاح"
  );

  showAdminSection("employees");

  updateDashboard();

}


function deleteEmployee(code){

  if(!confirm("هل تريد حذف الموظف؟"))return;

  employees =
    employees.filter(
      e=>e.code!==code
    );

  saveData();

  showAdminSection("employees");

  updateDashboard();

}


function employeeName(code){

  const e =
    employees.find(
      x=>x.code===code
    );

  return e ? e.name : code;

}

function loadEmployeeNotifications(){

  const box =
    document.getElementById(
      "employeeNotifications"
    );

  const myPenalties =
    penalties.filter(
      p=>p.code===currentUser.code
    );

  const myLeaves =
    leaves.filter(
      l =>
      l.code===currentUser.code &&
      l.status!=="مقروء"
    );


  let html="";


  myPenalties.forEach(p=>{

    html+=`

      <div class="notice">

        ⚠️ <b>${p.type}</b>

        <br>

        ${p.details||""}

        <br>

        <small>${p.date}</small>

      </div>

    `;

  });


  myLeaves.forEach(l=>{

    if(l.status!=="معلق"){

      html+=`

        <div class="notice">

          📝 حالة طلب الإجازة:
          <b>${l.status}</b>

        </div>

      `;

    }

  });


  if(!html){

    html=
      `<div class="empty">
        لا توجد إشعارات جديدة
      </div>`;
  }


  box.innerHTML=html;

}

    );

  kaizens.push({

    code:currentUser.code,

    idea,

    impact:selected.value,

      .slice(0,10)

  });


  saveData();
