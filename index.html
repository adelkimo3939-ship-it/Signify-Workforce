<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075BFF">
<title>Signify Workforce</title>

<style>
*{
box-sizing:border-box;
font-family:Arial,Tahoma,sans-serif;
}

body{
margin:0;
background:#f4f7fb;
color:#172033;
}

.hidden{
display:none!important;
}

button,input,select,textarea{
font-family:inherit;
}

button{
cursor:pointer;
}

.login-page{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
background:linear-gradient(135deg,#075BFF,#00358f);
}

.login-box{
width:100%;
max-width:420px;
background:white;
border-radius:25px;
padding:30px 22px;
box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.logo{
text-align:center;
font-size:30px;
font-weight:bold;
color:#075BFF;
margin-bottom:5px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:25px;
}

label{
display:block;
margin:12px 0 7px;
font-weight:bold;
}

input,select,textarea{
width:100%;
border:1px solid #d7dce5;
border-radius:12px;
padding:13px;
font-size:16px;
background:#fff;
}

textarea{
min-height:110px;
resize:vertical;
}

.primary{
width:100%;
border:0;
background:#075BFF;
color:white;
padding:14px;
border-radius:13px;
font-size:17px;
margin-top:18px;
}

.secondary{
width:100%;
border:1px solid #075BFF;
background:white;
color:#075BFF;
padding:12px;
border-radius:13px;
font-size:16px;
margin-top:10px;
}

.danger{
background:#e53935!important;
color:white!important;
border:0!important;
}

.success{
background:#16a05d!important;
color:white!important;
border:0!important;
}

.warning{
background:#f5a900!important;
color:white!important;
border:0!important;
}

.app{
min-height:100vh;
}

.topbar{
background:#075BFF;
color:white;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.topbar h2{
margin:0;
font-size:21px;
}

.logout{
background:white;
color:#075BFF;
border:0;
padding:9px 14px;
border-radius:10px;
}

.container{
max-width:1200px;
margin:auto;
padding:18px;
}

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.card{
background:white;
border-radius:18px;
padding:18px;
box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.card-title{
color:#697386;
font-size:14px;
}

.number{
font-size:29px;
font-weight:bold;
margin-top:8px;
color:#075BFF;
}

.section{
margin-top:20px;
}

.panel{
background:white;
padding:18px;
border-radius:18px;
box-shadow:0 3px 14px rgba(0,0,0,.06);
margin-bottom:15px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.grid3{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
}

.menu{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.menu button{
padding:15px;
border:0;
border-radius:14px;
background:white;
color:#075BFF;
font-size:16px;
box-shadow:0 3px 12px rgba(0,0,0,.07);
}

table{
width:100%;
border-collapse:collapse;
margin-top:12px;
background:white;
}

th,td{
border-bottom:1px solid #eee;
padding:11px 7px;
text-align:center;
font-size:14px;
}

th{
background:#f0f4fa;
}

.badge{
display:inline-block;
padding:6px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.badge-green{
background:#dcfce7;
color:#166534;
}

.badge-red{
background:#fee2e2;
color:#991b1b;
}

.badge-yellow{
background:#fef3c7;
color:#92400e;
}

.badge-blue{
background:#dbeafe;
color:#1e40af;
}

.badge-purple{
background:#f3e8ff;
color:#6b21a8;
}

.notice{
background:#fff6d8;
border-right:5px solid #f5b400;
padding:12px;
border-radius:10px;
margin-bottom:10px;
}

.empty{
text-align:center;
color:#777;
padding:20px;
}

.kpi-box{
background:linear-gradient(135deg,#075BFF,#00358f);
color:white;
border-radius:22px;
padding:25px;
text-align:center;
margin-bottom:15px;
}

.kpi-number{
font-size:60px;
font-weight:bold;
}

.kpi-title{
font-size:17px;
opacity:.9;
}

.progress{
height:14px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
margin-top:8px;
}

.progress-bar{
height:100%;
background:#16a05d;
}

.small{
font-size:12px;
color:#777;
}

.action-row{
display:flex;
gap:6px;
justify-content:center;
flex-wrap:wrap;
}

.action-row button{
width:auto;
padding:8px 12px;
border-radius:8px;
border:0;
}

.kaizen-card{
border:1px solid #e3e7ef;
border-radius:15px;
padding:15px;
margin-top:10px;
background:#fafcff;
}

.status-pending{
color:#d97706;
font-weight:bold;
}

.status-approved{
color:#16a05d;
font-weight:bold;
}

.status-rejected{
color:#e53935;
font-weight:bold;
}

@media(max-width:800px){

.cards{
grid-template-columns:repeat(2,1fr);
}

.grid3{
grid-template-columns:1fr;
}

.container{
padding:12px;
}

}

@media(max-width:600px){

.grid{
grid-template-columns:1fr;
}

.menu{
grid-template-columns:1fr;
}

table{
font-size:12px;
display:block;
overflow-x:auto;
white-space:nowrap;
}

th,td{
padding:8px 5px;
}

.kpi-number{
font-size:50px;
}

}
</style>
</head>

<body>

<!-- =====================================================
LOGIN
===================================================== -->

<div id="loginPage" class="login-page">

<div class="login-box">

<div class="logo">
Signify Workforce
</div>

<div class="subtitle">
نظام إدارة الموظفين والحضور والـ KPI
</div>

<label>نوع المستخدم</label>

<select id="loginType">

<option value="employee">موظف</option>
<option value="admin">مشرف</option>
<option value="viewer">قراءة فقط</option>

</select>

<label>
الكود
</label>

<input
id="loginCode"
type="text"
placeholder="اكتب الكود">

<label>
كلمة المرور
</label>

<input
id="loginPassword"
type="password"
placeholder="اكتب كلمة المرور">

<button
class="primary"
onclick="login()">

تسجيل الدخول

</button>

<div
id="loginMessage"
style="color:#e53935;text-align:center;margin-top:12px">
</div>

</div>
</div>


<!-- =====================================================
APP
===================================================== -->

<div id="app" class="app hidden">

<div class="topbar">

<div>

<h2>
Signify Workforce
</h2>

<div id="welcome"></div>

</div>

<button
class="logout"
onclick="logout()">

خروج

</button>

</div>


<div class="container">


<!-- =====================================================
ADMIN
===================================================== -->

<div id="adminPage" class="hidden">

<div class="cards">

<div class="card">
<div class="card-title">الموظفين</div>
<div class="number" id="totalEmployees">0</div>
</div>

<div class="card">
<div class="card-title">الحضور اليوم</div>
<div class="number" id="presentCount">0</div>
</div>

<div class="card">
<div class="card-title">الغياب اليوم</div>
<div class="number" id="absentCount">0</div>
</div>

<div class="card">
<div class="card-title">التأخير اليوم</div>
<div class="number" id="lateCount">0</div>
</div>

</div>


<div class="section">

<div class="menu">

<button onclick="showAdminSection('attendance')">
🕘 الحضور والانصراف
</button>

<button onclick="showAdminSection('employees')">
👥 الموظفين
</button>

<button onclick="showAdminSection('kpi')">
📊 KPI
</button>

<button onclick="showAdminSection('penalties')">
⚠️ التأخيرات والجزاءات
</button>

<button onclick="showAdminSection('leaveRequests')">
📝 طلبات الإجازة
</button>

<button onclick="showAdminSection('kaizen')">
💡 Kaizen
</button>

<button onclick="showAdminSection('monthly')">
📅 الحضور الشهري
</button>

<button onclick="showAdminSection('password')">
🔐 تغيير باسورد المشرف
</button>

</div>

</div>

<div id="adminContent" class="section"></div>

</div>


<!-- =====================================================
VIEWER
===================================================== -->

<div id="viewerPage" class="hidden">

<div class="panel">

<h3>
👁️ لوحة القراءة فقط
</h3>

<p>
يمكنك الاطلاع على الحضور والانصراف و KPI والتأخيرات والجزاءات وطلبات الإجازة وKaizen.
</p>

</div>

<div id="viewerContent"></div>

</div>


<!-- =====================================================
EMPLOYEE
===================================================== -->

<div id="employeePage" class="hidden">

<div class="panel">

<h3 id="employeeName"></h3>

<div class="small" id="employeeJob"></div>

<div id="employeeNotifications"></div>

</div>


<!-- KPI يظهر مباشرة -->

<div id="employeeHomeKPI"></div>


<div class="menu">

<button onclick="employeeAttendance()">
🕘 حضوري
</button>

<button onclick="employeeKPI()">
📊 KPI الخاص بي
</button>

<button onclick="employeeLeave()">
📝 طلب إجازة
</button>

<button onclick="employeeKaizen()">
💡 Kaizen
</button>

<button onclick="employeePassword()">
🔐 تغيير الباسورد
</button>

</div>


<div
id="employeeContent"
class="section">
</div>

</div>

</div>
</div>


<script>

/* =====================================================
DATA
===================================================== */

let employees =
JSON.parse(localStorage.getItem("sw_employees")) || [];

let attendance =
JSON.parse(localStorage.getItem("sw_attendance")) || [];

let penalties =
JSON.parse(localStorage.getItem("sw_penalties")) || [];

let leaves =
JSON.parse(localStorage.getItem("sw_leaves")) || [];

let kaizens =
JSON.parse(localStorage.getItem("sw_kaizens")) || [];

let currentUser=null;


/* =====================================================
ADMIN
===================================================== */

let admin =
JSON.parse(localStorage.getItem("sw_admin"));

if(!admin){

admin={
code:"admin",
password:"1234",
name:"مشرف النظام"
};

localStorage.setItem(
"sw_admin",
JSON.stringify(admin)
);

}


/* =====================================================
HELPERS
===================================================== */

function today(){

return new Date()
.toISOString()
.slice(0,10);

}


function employeeByCode(code){

return employees.find(
e=>e.code===code
);

}


function employeeName(code){

const e=employeeByCode(code);

return e ? e.name : code;

}


function employeeJob(code){

const e=employeeByCode(code);

return e ? (e.job||"-") : "-";

}


function currentMonth(){

return new Date()
.toISOString()
.slice(0,7);

}


function saveData(){

localStorage.setItem(
"sw_employees",
JSON.stringify(employees)
);

localStorage.setItem(
"sw_attendance",
JSON.stringify(attendance)
);

localStorage.setItem(
"sw_penalties",
JSON.stringify(penalties)
);

localStorage.setItem(
"sw_leaves",
JSON.stringify(leaves)
);

localStorage.setItem(
"sw_kaizens",
JSON.stringify(kaizens)
);

}


/* =====================================================
LOGIN
===================================================== */

function login(){

const type=
document.getElementById("loginType").value;

const code=
document.getElementById("loginCode").value.trim();

const password=
document.getElementById("loginPassword").value;

const message=
document.getElementById("loginMessage");

message.innerText="";

if(!code || !password){

message.innerText=
"اكتب الكود وكلمة المرور";

return;

}


/* ADMIN */

if(type==="admin"){

if(
code===admin.code &&
password===admin.password
){

currentUser={
type:"admin",
code:admin.code,
name:admin.name
};

openApp();

return;

}

message.innerText=
"كود المشرف أو كلمة المرور غير صحيحة";

return;

}


/* EMPLOYEE */

if(type==="employee"){

const employee=
employees.find(
e =>
e.code===code &&
e.password===password
);

if(!employee){

message.innerText=
"كود الموظف أو كلمة المرور غير صحيحة";

return;

}

currentUser={
type:"employee",
code:employee.code,
name:employee.name
};

openApp();

return;

}


/* VIEWER */

if(type==="viewer"){

if(
code==="viewer" &&
password==="1234"
){

currentUser={
type:"viewer",
code:"viewer",
name:"قارئ البيانات"
};

openApp();

return;

}

message.innerText=
"بيانات القراءة فقط غير صحيحة";

}

}


/* =====================================================
OPEN APP
===================================================== */

function openApp(){

document.getElementById("loginPage")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

document.getElementById("welcome")
.innerText=
"مرحباً " + currentUser.name;

document.getElementById("adminPage")
.classList.add("hidden");

document.getElementById("employeePage")
.classList.add("hidden");

document.getElementById("viewerPage")
.classList.add("hidden");


if(currentUser.type==="admin"){

document.getElementById("adminPage")
.classList.remove("hidden");

updateDashboard();

showAdminSection("attendance");

}


if(currentUser.type==="employee"){

document.getElementById("employeePage")
.classList.remove("hidden");

loadEmployee();

}


if(currentUser.type==="viewer"){

document.getElementById("viewerPage")
.classList.remove("hidden");

loadViewer();

}

}


/* =====================================================
LOGOUT
===================================================== */

function logout(){

currentUser=null;

document.getElementById("app")
.classList.add("hidden");

document.getElementById("loginPage")
.classList.remove("hidden");

document.getElementById("loginCode").value="";

document.getElementById("loginPassword").value="";

document.getElementById("loginMessage").innerText="";

}


/* =====================================================
DASHBOARD
===================================================== */

function updateDashboard(){

const d=today();

const present=
attendance.filter(
a=>
a.date===d &&
a.status==="حضور"
).length;

const absent=
attendance.filter(
a=>
a.date===d &&
a.status==="غياب"
).length;

const late=
attendance.filter(
a=>
a.date===d &&
a.late===true
).length;

document.getElementById("totalEmployees")
.innerText=employees.length;

document.getElementById("presentCount")
.innerText=present;

document.getElementById("absentCount")
.innerText=absent;

document.getElementById("lateCount")
.innerText=late;

}


/* =====================================================
ADMIN SECTIONS
===================================================== */

function showAdminSection(section){

const box=
document.getElementById("adminContent");


/* =====================================================
EMPLOYEES
===================================================== */

if(section==="employees"){

box.innerHTML=`

<div class="panel">

<h3>➕ إضافة موظف / ضيف</h3>

<div class="grid">

<div>
<label>اسم الموظف</label>
<input id="newName" placeholder="اسم الموظف">
</div>

<div>
<label>كود الموظف</label>
<input id="newCode" placeholder="الكود">
</div>

<div>
<label>الباسورد</label>
<input id="newPassword" value="1234">
</div>

<div>
<label>الوظيفة</label>
<input id="newJob" placeholder="مثال: Operator">
</div>

<div>
<label>القسم</label>
<input id="newDepartment" placeholder="القسم">
</div>

<div>
<label>نوع الحساب</label>

<select id="newRole">

<option value="employee">
موظف
</option>

<option value="guest">
ضيف
</option>

</select>

</div>

</div>

<button
class="primary"
onclick="addEmployee()">

إضافة الموظف

</button>

</div>


<div class="panel">

<h3>👥 قائمة الموظفين</h3>

<table>

<tr>

<th>الكود</th>
<th>الاسم</th>
<th>الوظيفة</th>
<th>القسم</th>
<th>نوع الحساب</th>
<th>الباسورد</th>
<th>حذف</th>

</tr>

${
employees.length===0

?

`<tr>
<td colspan="7" class="empty">
لا يوجد موظفين
</td>
</tr>`

:

employees.map(
e=>`

<tr>

<td>${e.code}</td>

<td>${e.name}</td>

<td>${e.job||"-"}</td>

<td>${e.department||"-"}</td>

<td>
${e.role==="guest" ? "ضيف" : "موظف"}
</td>

<td>${e.password}</td>

<td>

<button
class="danger"
style="padding:8px 12px;border-radius:8px"
onclick="deleteEmployee('${e.code}')">

حذف

</button>

</td>

</tr>

`
).join("")
}

</table>

</div>

`;

return;
}


/* =====================================================
ATTENDANCE
===================================================== */

if(section==="attendance"){

box.innerHTML=`

<div class="panel">

<h3>🕘 تسجيل حضور / حالة يوم</h3>

<label>الموظف</label>

<select id="attendanceEmployee">

${
employees.map(
e=>`

<option value="${e.code}">
${e.code} - ${e.name}
</option>

`
).join("")
}

</select>

<label>التاريخ</label>

<input
type="date"
id="attendanceDate"
value="${today()}">

<label>وقت الحضور</label>

<input
type="time"
id="attendanceTime"
value="08:00">

<label>الحالة</label>

<select id="attendanceStatus">

<option>حضور</option>
<option>غياب</option>
<option>مرضي</option>
<option>عارضة</option>
<option>إجازة</option>

</select>

<label>هل يوجد تأخير؟</label>

<select id="attendanceLate">

<option value="no">لا</option>
<option value="yes">نعم</option>

</select>

<button
class="primary"
onclick="saveAttendance()">

حفظ الحالة

</button>

</div>


<div class="panel">

<h3>آخر التسجيلات</h3>

<table>

<tr>

<th>التاريخ</th>
<th>الموظف</th>
<th>الوظيفة</th>
<th>الحالة</th>
<th>الوقت</th>
<th>تأخير</th>

</tr>

${
attendance.length===0

?

`<tr>
<td colspan="6" class="empty">
لا توجد تسجيلات
</td>
</tr>`

:

attendance
.slice()
.reverse()
.map(
a=>`

<tr>

<td>${a.date}</td>

<td>${employeeName(a.code)}</td>

<td>${employeeJob(a.code)}</td>

<td>${statusBadge(a.status)}</td>

<td>${a.time||"-"}</td>

<td>${a.late?"نعم":"لا"}</td>

</tr>

`
).join("")
}

</table>

</div>

`;

return;
}


/* =====================================================
MONTHLY ATTENDANCE
===================================================== */

if(section==="monthly"){

box.innerHTML=`

<div class="panel">

<h3>📅 حضور الموظفين على مدار الشهر</h3>

<div class="grid">

<div>

<label>الشهر</label>

<input
type="month"
id="monthlyMonth"
value="${currentMonth()}"
onchange="renderAdminMonthly()">

</div>

<div>

<label>الموظف</label>

<select
id="monthlyEmployee"
onchange="renderAdminMonthly()">

<option value="">
كل الموظفين
</option>

${
employees.map(
e=>`

<option value="${e.code}">
${e.code} - ${e.name}
</option>

`
).join("")
}

</select>

</div>

</div>

<div id="adminMonthlyTable"></div>

</div>

`;

renderAdminMonthly();

return;
}


/* =====================================================
PENALTIES
===================================================== */

if(section==="penalties"){

box.innerHTML=`

<div class="panel">

<h3>⚠️ إضافة تأخير / جزاء / مخالفة</h3>

<label>الموظف</label>

<select id="penaltyEmployee">

${
employees.map(
e=>`

<option value="${e.code}">
${e.code} - ${e.name}
</option>

`
).join("")
}

</select>

<label>النوع</label>

<select id="penaltyType">

<option>تأخير</option>
<option>تأخير من البريك</option>
<option>جزاء</option>
<option>مخالفة الزي</option>
<option>مخالفة أخرى</option>

</select>

<label>التاريخ</label>

<input
type="date"
id="penaltyDate"
value="${today()}">

<label>النقاط المخصومة من KPI</label>

<input
type="number"
id="penaltyPoints"
value="1"
min="0">

<label>التفاصيل</label>

<textarea
id="penaltyDetails"
placeholder="اكتب التفاصيل هنا">
</textarea>

<button
class="primary"
onclick="savePenalty()">

حفظ وإرسال إشعار للموظف

</button>

</div>


<div class="panel">

<h3>📋 السجل</h3>

<table>

<tr>

<th>التاريخ</th>
<th>الموظف</th>
<th>النوع</th>
<th>النقاط</th>
<th>التفاصيل</th>

</tr>

${
penalties.length===0

?

`<tr>
<td colspan="5" class="empty">
لا توجد مخالفات أو جزاءات
</td>
</tr>`

:

penalties
.slice()
.reverse()

/* =====================================================
KPI
===================================================== */

function calculateKPI(code){

const records=
penalties.filter(
p=>p.code===code
);

let late=0;
let breakLate=0;
let penaltiesCount=0;
let uniform=0;
let totalPoints=0;

records.forEach(
p=>{

const points=
Number(p.points)||0;

totalPoints+=points;

if(p.type==="تأخير"){

late++;

}

else if(
p.type==="تأخير من البريك"
){

breakLate++;

}

else if(
p.type==="جزاء"
){

penaltiesCount++;

}

else if(
p.type==="مخالفة الزي"
){

uniform++;

}

}
);


/*
KPI يبدأ من 100
ويتم خصم النقاط المسجلة
*/

let kpi=
100-totalPoints;

if(kpi<0){
kpi=0;
}

if(kpi>100){
kpi=100;
}

return{

late:late,

breakLate:breakLate,

penalties:penaltiesCount,

uniform:uniform,

points:totalPoints,

kpi:kpi

};

}
